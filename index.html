<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#05060d" />
<title>Sonnensystem</title>
<style>
  :root {
    --bg: #05060d;
    --panel: rgba(16, 19, 34, 0.82);
    --panel-border: rgba(120, 150, 255, 0.22);
    --text: #eef1ff;
    --muted: #9aa3c7;
    --accent: #6ea8ff;
    --danger: #ff5a5a;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overscroll-behavior: none;
    touch-action: none;
    user-select: none;
  }

  #stage {
    position: fixed;
    inset: 0;
    display: block;
    touch-action: none;
    cursor: crosshair;
  }

  /* ---- Top HUD ---- */
  .hud-top {
    position: fixed;
    top: max(14px, env(safe-area-inset-top));
    left: 0; right: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    pointer-events: none;
    z-index: 5;
  }
  .hud-top h1 {
    margin: 0;
    font-size: clamp(13px, 3.6vw, 18px);
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #f3f5ff;
    text-shadow: 0 2px 18px rgba(110, 168, 255, 0.45);
  }
  .target {
    font-size: clamp(11px, 3vw, 13px);
    letter-spacing: 0.08em;
    color: var(--muted);
    min-height: 16px;
    transition: color 0.15s;
  }
  .target.locked { color: var(--danger); font-weight: 600; }

  .counter {
    position: fixed;
    top: max(14px, env(safe-area-inset-top));
    left: max(14px, env(safe-area-inset-left));
    z-index: 5;
    font-size: 12px;
    letter-spacing: 0.05em;
    color: var(--muted);
    background: rgba(10,12,24,0.5);
    border: 1px solid var(--panel-border);
    padding: 7px 12px;
    border-radius: 10px;
    pointer-events: none;
  }
  .counter b { color: var(--text); }

  /* ---- Controls (bottom-left cluster) ---- */
  .controls {
    position: fixed;
    left: max(14px, env(safe-area-inset-left));
    bottom: max(16px, env(safe-area-inset-bottom));
    z-index: 6;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 13px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 999px;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
  }
  .btn {
    appearance: none;
    border: 1px solid rgba(255,255,255,0.12);
    background: rgba(255,255,255,0.06);
    color: var(--text);
    width: 40px;
    height: 40px;
    border-radius: 50%;
    font-size: 16px;
    display: grid;
    place-items: center;
    cursor: pointer;
    transition: background 0.18s, transform 0.1s;
    flex: none;
  }
  .btn:hover { background: rgba(255,255,255,0.13); }
  .btn:active { transform: scale(0.92); }
  .slider-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11.5px;
    color: var(--muted);
    white-space: nowrap;
  }
  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: clamp(70px, 22vw, 120px);
    height: 6px;
    border-radius: 999px;
    background: rgba(255,255,255,0.16);
    outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 18px; height: 18px; border-radius: 50%;
    background: var(--accent); box-shadow: 0 0 10px rgba(110,168,255,0.8); cursor: pointer;
  }
  input[type="range"]::-moz-range-thumb {
    width: 18px; height: 18px; border: none; border-radius: 50%;
    background: var(--accent); box-shadow: 0 0 10px rgba(110,168,255,0.8); cursor: pointer;
  }

  /* ---- FIRE button ---- */
  .fire {
    position: fixed;
    right: max(20px, env(safe-area-inset-right));
    bottom: calc(max(16px, env(safe-area-inset-bottom)) + 12px);
    z-index: 7;
    width: 92px; height: 92px;
    border-radius: 50%;
    border: 2px solid rgba(255, 90, 90, 0.7);
    background: radial-gradient(circle at 50% 38%, rgba(255,120,90,0.55), rgba(150,20,20,0.85));
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.12em;
    cursor: pointer;
    box-shadow: 0 0 26px rgba(255,70,70,0.5), inset 0 -6px 16px rgba(0,0,0,0.4);
    transition: transform 0.06s, box-shadow 0.12s;
  }
  .fire:active {
    transform: scale(0.9);
    box-shadow: 0 0 36px rgba(255,90,90,0.9), inset 0 -4px 12px rgba(0,0,0,0.5);
  }

  /* ---- Hint ---- */
  .hint {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    bottom: calc(max(16px, env(safe-area-inset-bottom)) + 118px);
    z-index: 5;
    font-size: 12px;
    color: var(--muted);
    background: rgba(10,12,24,0.55);
    padding: 7px 15px;
    border-radius: 999px;
    pointer-events: none;
    transition: opacity 0.6s;
    text-align: center;
    max-width: 86vw;
  }

  /* ---- Info / scan card ---- */
  .card {
    position: fixed;
    z-index: 10;
    right: max(16px, env(safe-area-inset-right));
    top: max(76px, calc(env(safe-area-inset-top) + 70px));
    width: min(330px, calc(100vw - 32px));
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 18px;
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    box-shadow: 0 18px 60px rgba(0,0,0,0.55);
    padding: 18px 18px 20px;
    transform: translateY(-14px) scale(0.98);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.28s ease, transform 0.28s ease;
  }
  .card.show { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }
  @media (max-width: 620px) {
    .card { right: 12px; left: 12px; width: auto; top: 84px; }
  }
  .card-head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .swatch { width: 34px; height: 34px; border-radius: 50%; flex: none; box-shadow: 0 0 18px currentColor; }
  .card h2 { margin: 0; font-size: 20px; font-weight: 650; letter-spacing: 0.02em; flex: 1; }
  .card .close {
    appearance: none; border: none; background: rgba(255,255,255,0.08); color: var(--text);
    width: 30px; height: 30px; border-radius: 50%; font-size: 16px; cursor: pointer; flex: none;
  }
  .card .close:active { transform: scale(0.9); }
  .card .desc { margin: 0 0 14px; font-size: 13.5px; line-height: 1.5; color: #d4d9f5; }
  .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
  .fact {
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.06);
    border-radius: 11px; padding: 9px 11px;
  }
  .fact .label { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin-bottom: 3px; }
  .fact .value { font-size: 14px; font-weight: 600; color: #fff; }
  .footnote { margin: 12px 0 0; font-size: 10.5px; line-height: 1.4; color: var(--muted); }
  .destroy-btn {
    margin-top: 14px;
    width: 100%;
    appearance: none;
    border: 1px solid rgba(255, 90, 90, 0.5);
    background: rgba(255, 70, 70, 0.14);
    color: #ff9b9b;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 11px;
    border-radius: 12px;
    cursor: pointer;
    transition: background 0.15s, transform 0.08s;
  }
  .destroy-btn:hover { background: rgba(255, 70, 70, 0.24); }
  .destroy-btn:active { transform: scale(0.97); }
  .destroy-btn[disabled] { opacity: 0.4; cursor: default; }

  /* ---- Start screen ---- */
  .start {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 24px;
    background: radial-gradient(circle at 50% 35%, rgba(20,26,52,0.72), rgba(4,5,12,0.92));
    backdrop-filter: blur(7px);
    -webkit-backdrop-filter: blur(7px);
    text-align: center;
    transition: opacity 0.45s ease, visibility 0.45s ease;
  }
  .start.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
  .start .badge {
    font-size: 40px;
    filter: drop-shadow(0 0 18px rgba(110,168,255,0.6));
    margin-bottom: 4px;
  }
  .start h1 {
    margin: 0;
    font-size: clamp(26px, 8vw, 46px);
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #f3f5ff;
    text-shadow: 0 4px 30px rgba(110, 168, 255, 0.5);
  }
  .start .sub {
    margin: 6px 0 26px;
    font-size: clamp(12px, 3.4vw, 15px);
    color: var(--muted);
    letter-spacing: 0.04em;
  }
  .modes {
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
    justify-content: center;
    width: 100%;
    max-width: 580px;
  }
  .mode-card {
    flex: 1 1 230px;
    max-width: 270px;
    min-height: 200px;
    appearance: none;
    cursor: pointer;
    text-align: left;
    color: var(--text);
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 20px;
    padding: 22px 20px;
    display: flex;
    flex-direction: column;
    gap: 9px;
    transition: transform 0.16s ease, border-color 0.16s ease, box-shadow 0.16s ease, background 0.16s ease;
  }
  .mode-card:hover, .mode-card:focus-visible {
    transform: translateY(-4px);
    border-color: rgba(150,180,255,0.55);
    box-shadow: 0 16px 50px rgba(0,0,0,0.5);
    background: rgba(26, 31, 52, 0.9);
    outline: none;
  }
  .mode-card:active { transform: translateY(-1px) scale(0.99); }
  .mode-card .mode-icon { font-size: 38px; line-height: 1; }
  .mode-card .mode-name {
    font-size: 21px; font-weight: 650; letter-spacing: 0.03em;
  }
  .mode-card .mode-desc { font-size: 13px; line-height: 1.5; color: var(--muted); }
  .mode-card.blaster:hover, .mode-card.blaster:focus-visible { border-color: rgba(255,120,120,0.6); }
  .mode-card .tag {
    margin-top: auto;
    align-self: flex-start;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
    border: 1px solid rgba(110,168,255,0.4);
    border-radius: 999px;
    padding: 4px 10px;
  }
  .mode-card.blaster .tag { color: #ff9b9b; border-color: rgba(255,120,120,0.45); }
</style>
</head>
<body>
  <canvas id="stage"></canvas>

  <div class="start" id="startScreen">
    <div class="badge">🪐</div>
    <h1>Sonnensystem</h1>
    <p class="sub">Wähle, wie du es erleben möchtest</p>
    <div class="modes">
      <button class="mode-card explore" data-mode="explore">
        <span class="mode-icon">🔭</span>
        <span class="mode-name">Erkunden</span>
        <span class="mode-desc">Umkreise das System und tippe auf einen Planeten oder die Sonne, um Fakten zu lesen. Friedlich – nichts wird zerstört.</span>
        <span class="tag">Ansehen &amp; lernen</span>
      </button>
      <button class="mode-card blaster" data-mode="blaster">
        <span class="mode-icon">🔫</span>
        <span class="mode-name">Blaster</span>
        <span class="mode-desc">Ziele und sprenge Planeten mit deiner Kanone. Du kannst sie vorher noch scannen.</span>
        <span class="tag">Zielen</span>
      </button>
    </div>
  </div>

  <div class="counter" id="counter">Planeten: <b id="aliveCount">8</b> / 8</div>

  <div class="hud-top">
    <h1 id="hudTitle">Sonnensystem</h1>
    <div class="target" id="targetLabel"></div>
  </div>

  <div class="hint" id="hint">Ziehen, um die Ansicht zu drehen &nbsp;&bull;&nbsp; Tippe einen Planeten für Fakten</div>

  <div class="controls">
    <button class="btn" id="menuBtn" title="Modus wechseln" aria-label="Modus wechseln">⌂</button>
    <button class="btn" id="playBtn" title="Pause / Wiedergabe" aria-label="Pause oder Wiedergabe">⏸</button>
    <div class="slider-wrap">
      <span>Tempo</span>
      <input type="range" id="speed" min="0" max="300" value="100" />
    </div>
    <button class="btn" id="respawnBtn" title="Planeten neu erzeugen" aria-label="Planeten neu erzeugen">↺</button>
  </div>

  <button class="fire" id="fireBtn">FEUER</button>

  <div class="card" id="card">
    <div class="card-head">
      <span class="swatch" id="cardSwatch"></span>
      <h2 id="cardName">Planet</h2>
      <button class="close" id="cardClose" aria-label="Close">✕</button>
    </div>
    <p class="desc" id="cardDesc"></p>
    <div class="facts" id="cardFacts"></div>
    <p class="footnote">⚽ Fußballfelder = Oberfläche ÷ ein Standardspielfeld (105 × 68 m ≈ 7.140 m²)</p>
    <button class="destroy-btn" id="cardDestroy">🔫 Diesen Planeten zerstören</button>
  </div>

<script>
(function () {
  "use strict";

  const canvas = document.getElementById("stage");
  const ctx = canvas.getContext("2d");

  // ---------- Body data (orbit/size are scaled world units) ----------
  const PLANETS = [
    {
      name: "Merkur", orbit: 16, size: 1.3, period: 88, colors: ["#cfc6bb", "#6e655a"],
      desc: "Der kleinste Planet und der sonnennächste – er rast schneller um die Sonne als jede andere Welt.",
      facts: { "Durchmesser": "4.879 km", "Tageslänge": "1.408 Std.", "Jahr": "88 Tage", "Monde": "0", "Entfernung": "58 Mio. km", "Oberfläche": "−173 bis 427 °C", "Fußballfelder": "~10,5 Milliarden" }
    },
    {
      name: "Venus", orbit: 23, size: 2.2, period: 225, colors: ["#f0d9a8", "#b07d3a"],
      desc: "Eine glühend heiße, wolkenverhüllte Welt, deren außer Kontrolle geratener Treibhauseffekt sie zum heißesten Planeten macht.",
      facts: { "Durchmesser": "12.104 km", "Tageslänge": "5.832 Std.", "Jahr": "225 Tage", "Monde": "0", "Entfernung": "108 Mio. km", "Oberfläche": "~465 °C", "Fußballfelder": "~64 Milliarden" }
    },
    {
      name: "Erde", orbit: 31, size: 2.3, period: 365, colors: ["#7fb6f0", "#1c4f8c"],
      desc: "Unsere Heimat – der einzige bekannte Ort mit Leben, mit flüssigen Ozeanen und einer schützenden Atmosphäre.",
      facts: { "Durchmesser": "12.742 km", "Tageslänge": "24 Std.", "Jahr": "365 Tage", "Monde": "1", "Entfernung": "150 Mio. km", "Oberfläche": "~15 °C Ø", "Fußballfelder": "~71 Milliarden" }
    },
    {
      name: "Mars", orbit: 40, size: 1.7, period: 687, colors: ["#e08a5a", "#8a3a20"],
      desc: "Der rostige Rote Planet, Heimat des größten Vulkans und der tiefsten Schlucht im Sonnensystem.",
      facts: { "Durchmesser": "6.779 km", "Tageslänge": "24,6 Std.", "Jahr": "687 Tage", "Monde": "2", "Entfernung": "228 Mio. km", "Oberfläche": "−63 °C Ø", "Fußballfelder": "~20 Milliarden" }
    },
    {
      name: "Jupiter", orbit: 58, size: 5.6, period: 4333, colors: ["#e6c9a0", "#9c6b3f"],
      desc: "Ein gewaltiger Gasriese, dessen Großer Roter Fleck ein Sturm größer als die gesamte Erde ist.",
      facts: { "Durchmesser": "139.820 km", "Tageslänge": "9,9 Std.", "Jahr": "11,9 Jahre", "Monde": "95+", "Entfernung": "778 Mio. km", "Oberfläche": "−110 °C", "Fußballfelder": "~8,6 Billionen" }
    },
    {
      name: "Saturn", orbit: 76, size: 4.8, period: 10759, colors: ["#f2e2b0", "#b59557"], ring: true,
      desc: "Das Juwel des Sonnensystems, umgeben von schillernden Ringen aus Eis und Gestein.",
      facts: { "Durchmesser": "116.460 km", "Tageslänge": "10,7 Std.", "Jahr": "29,5 Jahre", "Monde": "146+", "Entfernung": "1,43 Mrd. km", "Oberfläche": "−140 °C", "Fußballfelder": "~6 Billionen" }
    },
    {
      name: "Uranus", orbit: 94, size: 3.4, period: 30687, colors: ["#bdeaf0", "#4f97a8"],
      desc: "Ein Eisriese, der auf der Seite liegt und wie ein Ball um die Sonne rollt.",
      facts: { "Durchmesser": "50.724 km", "Tageslänge": "17,2 Std.", "Jahr": "84 Jahre", "Monde": "28", "Entfernung": "2,87 Mrd. km", "Oberfläche": "−195 °C", "Fußballfelder": "~1,1 Billionen" }
    },
    {
      name: "Neptun", orbit: 110, size: 3.3, period: 60190, colors: ["#7aa3f0", "#2a4a9c"],
      desc: "Der äußerste Planet – eine tiefblaue Welt mit den schnellsten Winden im Sonnensystem.",
      facts: { "Durchmesser": "49.244 km", "Tageslänge": "16,1 Std.", "Jahr": "164,8 Jahre", "Monde": "16", "Entfernung": "4,5 Mrd. km", "Oberfläche": "−200 °C", "Fußballfelder": "~1,1 Billionen" }
    }
  ];

  const SPEED_REF = 365;
  PLANETS.forEach((p) => {
    p.angle = Math.random() * Math.PI * 2;
    p.angSpeed = SPEED_REF / p.period;
    p.alive = true;
    p.screen = { x: 0, y: 0, r: 0, cz: -1, visible: false };
  });

  const SUN = {
    name: "Sonne", size: 7, colors: ["#fff6d8", "#ff9b21"], isSun: true,
    desc: "Der Stern im Herzen des Sonnensystems – eine riesige Kugel aus heißem Plasma, deren Schwerkraft alle Planeten auf ihrer Bahn hält. Sie macht etwa 99,86 % der gesamten Masse hier aus.",
    facts: { "Durchmesser": "1.391.000 km", "Typ": "G-Typ-Stern", "Oberfläche": "~5.500 °C", "Kern": "~15 Mio. °C", "Alter": "4,6 Mrd. Jahre", "Masse": "333.000 Erden", "Fußballfelder": "~850 Billionen" },
    screen: { x: 0, y: 0, r: 0, cz: -1, visible: false }
  };

  // ---------- Camera ----------
  let W = 0, H = 0, DPR = 1, cx = 0, cy = 0, focal = 800;
  let camPos = { x: 0, y: 26, z: -150 };
  const NEAR = 0.6;

  // Blaster: first-person camera at a fixed point, look direction from yaw/pitch.
  const BLASTER_POS = { x: 0, y: 26, z: -150 };
  let yaw = 0, pitch = -0.172;          // aimed roughly at the Sun

  // Explore: orbit camera that circles the Sun (target at origin).
  const TARGET = { x: 0, y: 0, z: 0 };
  let orbAzim = 0, orbElev = 1.5, orbRadius = 185;   // starts near top-down

  // basis vectors, recomputed each frame
  let fwd = { x: 0, y: 0, z: 1 }, right = { x: 1, y: 0, z: 0 }, up = { x: 0, y: 1, z: 0 };

  function buildBasisFromForward() {
    // right = normalize(cross(worldUp, fwd)); up = cross(fwd, right)
    right = { x: fwd.z, y: 0, z: -fwd.x };
    const rl = Math.hypot(right.x, right.z) || 1;
    right.x /= rl; right.z /= rl;
    up = {
      x: fwd.y * right.z - fwd.z * right.y,
      y: fwd.z * right.x - fwd.x * right.z,
      z: fwd.x * right.y - fwd.y * right.x
    };
  }

  function updateCamera() {
    if (mode === "explore") {
      const ce = Math.cos(orbElev), se = Math.sin(orbElev);
      const ca = Math.cos(orbAzim), sa = Math.sin(orbAzim);
      camPos.x = TARGET.x + orbRadius * ce * sa;
      camPos.y = TARGET.y + orbRadius * se;
      camPos.z = TARGET.z + orbRadius * ce * ca;
      const dx = TARGET.x - camPos.x, dy = TARGET.y - camPos.y, dz = TARGET.z - camPos.z;
      const dl = Math.hypot(dx, dy, dz) || 1;
      fwd = { x: dx / dl, y: dy / dl, z: dz / dl };
    } else {
      camPos.x = BLASTER_POS.x; camPos.y = BLASTER_POS.y; camPos.z = BLASTER_POS.z;
      const cp = Math.cos(pitch), sp = Math.sin(pitch);
      const cyw = Math.cos(yaw), syw = Math.sin(yaw);
      fwd = { x: cp * syw, y: sp, z: cp * cyw };
    }
    buildBasisFromForward();
  }

  function project(P, worldRadius, out) {
    const vx = P.x - camPos.x, vy = P.y - camPos.y, vz = P.z - camPos.z;
    const czc = vx * fwd.x + vy * fwd.y + vz * fwd.z;
    if (czc <= NEAR) { out.visible = false; out.cz = czc; return out; }
    const cxc = vx * right.x + vy * right.y + vz * right.z;
    const cyc = vx * up.x + vy * up.y + vz * up.z;
    out.x = cx + (cxc / czc) * focal;
    out.y = cy - (cyc / czc) * focal;
    out.r = (worldRadius / czc) * focal;
    out.cz = czc;
    out.visible = true;
    return out;
  }

  // ---------- State ----------
  let paused = false, speedMul = 1, lastT = performance.now();
  let mode = null;                 // "explore" | "blaster" | null (start screen)
  let selected = null;
  let currentTarget = null;        // planet under the crosshair
  let shake = 0;
  const beams = [];                // {t}
  const particles = [];            // explosion bits
  const rings = [];                // shockwave rings
  let gunRecoil = 0;

  // ---------- Stars (directions on a sphere) ----------
  let stars = [];
  function makeStars() {
    stars = [];
    const count = 520;
    for (let i = 0; i < count; i++) {
      const z = Math.random() * 2 - 1;
      const phi = Math.random() * Math.PI * 2;
      const s = Math.sqrt(1 - z * z);
      stars.push({
        d: { x: s * Math.cos(phi), y: z, z: s * Math.sin(phi) },
        r: Math.random() * 1.3 + 0.25,
        a: Math.random() * 0.6 + 0.3,
        tw: Math.random() * Math.PI * 2,
        ts: Math.random() * 1.5 + 0.4
      });
    }
  }

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    cx = W / 2; cy = H / 2;
    const fov = 72 * Math.PI / 180;
    focal = (H / 2) / Math.tan(fov / 2);
    // pick an orbit distance so the outermost planet fits the smaller screen axis
    const fit = Math.min(W, H);
    orbRadius = Math.max(150, Math.min(300, (122 * focal) / (0.46 * fit)));
  }

  // ---------- Drawing ----------
  function drawStars(t) {
    const sp = { x: 0, y: 0, r: 0, cz: 0, visible: false };
    for (const s of stars) {
      const czc = s.d.x * fwd.x + s.d.y * fwd.y + s.d.z * fwd.z;
      if (czc <= 0.2) continue;
      const cxc = s.d.x * right.x + s.d.y * right.y + s.d.z * right.z;
      const cyc = s.d.x * up.x + s.d.y * up.y + s.d.z * up.z;
      const x = cx + (cxc / czc) * focal;
      const y = cy - (cyc / czc) * focal;
      const tw = 0.55 + 0.45 * Math.sin(t * 0.001 * s.ts + s.tw);
      ctx.globalAlpha = s.a * tw * Math.min(1, czc);
      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.arc(x, y, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawOrbit(orbit) {
    const steps = 80;
    let started = false;
    const o = { x: 0, y: 0, r: 0, cz: 0, visible: false };
    ctx.beginPath();
    for (let i = 0; i <= steps; i++) {
      const a = (i / steps) * Math.PI * 2;
      project({ x: Math.cos(a) * orbit, y: 0, z: Math.sin(a) * orbit }, 0, o);
      if (!o.visible) { started = false; continue; }
      if (!started) { ctx.moveTo(o.x, o.y); started = true; }
      else ctx.lineTo(o.x, o.y);
    }
    ctx.strokeStyle = "rgba(150, 175, 255, 0.10)";
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  function drawSun(t) {
    const s = SUN.screen;
    if (!s.visible) return;
    const r = Math.max(6, s.r);
    const g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, r * 4.4);
    g.addColorStop(0, "rgba(255, 226, 150, 0.9)");
    g.addColorStop(0.18, "rgba(255, 180, 70, 0.5)");
    g.addColorStop(0.5, "rgba(255, 140, 40, 0.15)");
    g.addColorStop(1, "rgba(255, 120, 30, 0)");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(s.x, s.y, r * 4.4, 0, Math.PI * 2); ctx.fill();
    const core = ctx.createRadialGradient(s.x - r * 0.3, s.y - r * 0.3, r * 0.1, s.x, s.y, r);
    core.addColorStop(0, "#fff6d8"); core.addColorStop(0.6, "#ffd45e"); core.addColorStop(1, "#ff9b21");
    ctx.fillStyle = core;
    ctx.beginPath(); ctx.arc(s.x, s.y, r, 0, Math.PI * 2); ctx.fill();
  }

  function drawPlanet(p) {
    const s = p.screen;
    if (!s.visible) return;
    const r = Math.max(1.5, s.r);
    if (p.ring) {
      ctx.save();
      ctx.translate(s.x, s.y);
      ctx.rotate(-0.5);
      ctx.scale(1, 0.34);
      ctx.beginPath(); ctx.arc(0, 0, r * 2.0, 0, Math.PI * 2);
      ctx.lineWidth = r * 0.8; ctx.strokeStyle = "rgba(232, 214, 168, 0.5)"; ctx.stroke();
      ctx.restore();
    }
    const grad = ctx.createRadialGradient(s.x - r * 0.35, s.y - r * 0.35, r * 0.1, s.x, s.y, r);
    grad.addColorStop(0, p.colors[0]); grad.addColorStop(1, p.colors[1]);
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(s.x, s.y, r, 0, Math.PI * 2); ctx.fill();

    if (currentTarget === p) {
      ctx.beginPath(); ctx.arc(s.x, s.y, r + 7, 0, Math.PI * 2);
      ctx.strokeStyle = mode === "blaster" ? "rgba(255,90,90,0.9)" : "rgba(180,210,255,0.85)";
      ctx.lineWidth = 2; ctx.stroke();
    }
    if (mode === "explore" ? r > 3.5 : r > 7) {
      ctx.font = "600 12px -apple-system, Segoe UI, Roboto, sans-serif";
      ctx.textAlign = "center";
      ctx.fillStyle = "rgba(255,255,255,0.8)";
      ctx.fillText(p.name, s.x, s.y - r - 8);
    }
  }

  function drawParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
      const pt = particles[i];
      pt.life -= dt;
      if (pt.life <= 0) { particles.splice(i, 1); continue; }
      pt.x += pt.vx * dt; pt.y += pt.vy * dt;
      pt.vx *= 0.96; pt.vy *= 0.96;
      const a = pt.life / pt.maxLife;
      ctx.globalAlpha = a;
      ctx.fillStyle = pt.color;
      ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.size * (0.4 + a * 0.6), 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    for (let i = rings.length - 1; i >= 0; i--) {
      const rg = rings[i];
      rg.life -= dt;
      if (rg.life <= 0) { rings.splice(i, 1); continue; }
      const a = rg.life / rg.maxLife;
      rg.radius += rg.speed * dt;
      ctx.globalAlpha = a * 0.8;
      ctx.strokeStyle = rg.color;
      ctx.lineWidth = 2 + a * 3;
      ctx.beginPath(); ctx.arc(rg.x, rg.y, rg.radius, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  function drawBeams(t) {
    const muzzleY = H - 64;
    for (let i = beams.length - 1; i >= 0; i--) {
      const b = beams[i];
      const age = (t - b.t) / 130;
      if (age >= 1) { beams.splice(i, 1); continue; }
      const a = 1 - age;
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      for (const off of [-16, 16]) {
        ctx.beginPath();
        ctx.moveTo(cx + off, muzzleY);
        ctx.lineTo(cx, cy);
        ctx.strokeStyle = "rgba(120, 230, 255, " + (a * 0.9) + ")";
        ctx.lineWidth = 2 + a * 3;
        ctx.shadowColor = "rgba(120,230,255,0.9)";
        ctx.shadowBlur = 14;
        ctx.stroke();
      }
      ctx.restore();
    }
  }

  function drawGun() {
    const baseY = H + 8 + gunRecoil * 18;
    const w = Math.min(150, W * 0.4);
    ctx.save();
    ctx.translate(cx, baseY);
    // body
    const body = ctx.createLinearGradient(0, -90, 0, 0);
    body.addColorStop(0, "#3a4154"); body.addColorStop(1, "#11141f");
    ctx.fillStyle = body;
    roundRect(-w / 2, -78, w, 90, 18); ctx.fill();
    // barrel
    ctx.fillStyle = "#2b3142";
    roundRect(-15, -120, 30, 64, 8); ctx.fill();
    // muzzle glow
    const mg = ctx.createRadialGradient(0, -118, 1, 0, -118, 18);
    mg.addColorStop(0, "rgba(120,230,255,0.9)");
    mg.addColorStop(1, "rgba(120,230,255,0)");
    ctx.fillStyle = mg;
    ctx.beginPath(); ctx.arc(0, -118, 18, 0, Math.PI * 2); ctx.fill();
    // accent line
    ctx.fillStyle = "rgba(110,168,255,0.7)";
    roundRect(-w / 2 + 12, -34, w - 24, 5, 3); ctx.fill();
    ctx.restore();
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawCrosshair() {
    const locked = !!currentTarget;
    const col = locked ? "rgba(255,90,90,0.95)" : "rgba(180,210,255,0.7)";
    const R = 16;
    ctx.strokeStyle = col;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath();
    for (const [a] of [[0],[1],[2],[3]]) {
      const ang = a * Math.PI / 2;
      const ix = cx + Math.cos(ang) * (R - 5), iy = cy + Math.sin(ang) * (R - 5);
      const ox = cx + Math.cos(ang) * (R + 7), oy = cy + Math.sin(ang) * (R + 7);
      ctx.moveTo(ix, iy); ctx.lineTo(ox, oy);
    }
    ctx.stroke();
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(cx, cy, 1.6, 0, Math.PI * 2); ctx.fill();
  }

  // ---------- Update / render ----------
  function update(dt) {
    updateCamera();
    if (!paused) {
      const base = 0.085 * speedMul;
      for (const p of PLANETS) p.angle += p.angSpeed * base * dt;
    }
    project({ x: 0, y: 0, z: 0 }, SUN.size, SUN.screen);
    for (const p of PLANETS) {
      if (!p.alive) { p.screen.visible = false; continue; }
      project({ x: Math.cos(p.angle) * p.orbit, y: 0, z: Math.sin(p.angle) * p.orbit }, p.size, p.screen);
    }
    // crosshair target = nearest alive planet covering the centre
    currentTarget = null;
    let bestCz = Infinity;
    for (const p of PLANETS) {
      if (!p.alive || !p.screen.visible) continue;
      const d = Math.hypot(p.screen.x - cx, p.screen.y - cy);
      if (d < Math.max(p.screen.r * 1.15, 16) && p.screen.cz < bestCz) {
        bestCz = p.screen.cz; currentTarget = p;
      }
    }
    if (gunRecoil > 0) gunRecoil = Math.max(0, gunRecoil - dt * 6);
    if (shake > 0) shake = Math.max(0, shake - dt * 60);
    updateHud();
  }

  function render(t) {
    const bg = ctx.createRadialGradient(cx, cy * 0.7, 0, cx, cy, Math.max(W, H));
    bg.addColorStop(0, "#0b1024"); bg.addColorStop(1, "#04050c");
    ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

    drawStars(t);
    for (const p of PLANETS) if (p.alive) drawOrbit(p.orbit);

    const bodies = [SUN, ...PLANETS.filter(p => p.alive)].filter(b => b.screen.visible);
    bodies.sort((a, b) => b.screen.cz - a.screen.cz);
    for (const b of bodies) (b.isSun ? drawSun(t) : drawPlanet(b));

    drawParticles(lastDt);
    if (mode === "blaster") drawBeams(t);
    ctx.restore();

    if (mode === "blaster") {
      drawGun();
      drawCrosshair();
    }
  }

  let lastDt = 0.016;
  function loop(now) {
    let dt = (now - lastT) / 1000;
    if (dt > 0.05) dt = 0.05;
    lastT = now; lastDt = dt;
    update(dt);
    render(now);
    requestAnimationFrame(loop);
  }

  // ---------- HUD ----------
  const targetLabel = document.getElementById("targetLabel");
  const aliveCountEl = document.getElementById("aliveCount");
  function updateHud() {
    if (!mode) { targetLabel.textContent = ""; return; }
    if (mode === "blaster") {
      const alive = PLANETS.filter(p => p.alive).length;
      aliveCountEl.textContent = alive;
      if (alive === 0) {
        targetLabel.textContent = "ALLE PLANETEN ZERSTÖRT — drücke ↺ zum Neustart";
        targetLabel.classList.remove("locked");
      } else if (currentTarget) {
        targetLabel.textContent = "◎ ZIEL ERFASST: " + currentTarget.name.toUpperCase();
        targetLabel.classList.add("locked");
      } else {
        targetLabel.textContent = "Ziele auf einen Planeten…";
        targetLabel.classList.remove("locked");
      }
    } else {
      targetLabel.classList.remove("locked");
      targetLabel.textContent = currentTarget ? ("◎ " + currentTarget.name) : "";
    }
  }

  // ---------- Shooting ----------
  function spawnExplosion(x, y, colors) {
    for (let i = 0; i < 30; i++) {
      const ang = Math.random() * Math.PI * 2;
      const sp = 120 + Math.random() * 320;
      const palette = [colors[0], colors[1], "#ffffff", "#ffd27f"];
      particles.push({
        x, y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
        size: 2 + Math.random() * 5,
        life: 0.5 + Math.random() * 0.6, maxLife: 1.1,
        color: palette[(Math.random() * palette.length) | 0]
      });
    }
    rings.push({ x, y, radius: 4, speed: 380, life: 0.5, maxLife: 0.5, color: "rgba(255,210,140,0.9)" });
    shake = 12;
  }

  function destroyPlanet(p) {
    if (!p || !p.alive || p.isSun) return false;
    p.alive = false;
    const s = p.screen;
    const x = s.visible ? s.x : cx, y = s.visible ? s.y : cy;
    spawnExplosion(x, y, p.colors);
    if (selected === p) deselect();
    return true;
  }

  function fire() {
    if (mode !== "blaster") return;
    beams.push({ t: performance.now() });
    gunRecoil = 1;
    if (!destroyPlanet(currentTarget)) shake = Math.max(shake, 4); // miss: light kick
  }

  // ---------- Info card ----------
  const card = document.getElementById("card");
  const cardName = document.getElementById("cardName");
  const cardDesc = document.getElementById("cardDesc");
  const cardFacts = document.getElementById("cardFacts");
  const cardSwatch = document.getElementById("cardSwatch");
  const cardDestroy = document.getElementById("cardDestroy");

  function selectBody(b) {
    selected = b;
    cardName.textContent = b.name;
    cardDesc.textContent = b.desc;
    cardSwatch.style.color = b.colors[0];
    cardSwatch.style.background = "radial-gradient(circle at 30% 30%, " + b.colors[0] + ", " + b.colors[1] + ")";
    cardFacts.innerHTML = "";
    for (const k in b.facts) {
      const f = document.createElement("div");
      f.className = "fact";
      f.innerHTML = '<div class="label"></div><div class="value"></div>';
      f.querySelector(".label").textContent = k;
      f.querySelector(".value").textContent = b.facts[k];
      cardFacts.appendChild(f);
    }
    cardDestroy.style.display = (mode === "blaster") ? "" : "none";
    if (b.isSun) {
      cardDestroy.disabled = true;
      cardDestroy.textContent = "☀ Die Sonne kann nicht zerstört werden";
    } else {
      cardDestroy.disabled = false;
      cardDestroy.textContent = "🔫 Diesen Planeten zerstören";
    }
    card.classList.add("show");
    hideHint();
  }
  function deselect() { selected = null; card.classList.remove("show"); }

  cardDestroy.addEventListener("click", () => {
    if (selected && !selected.isSun) destroyPlanet(selected);
  });
  document.getElementById("cardClose").addEventListener("click", deselect);

  // tap (no drag) → scan body under finger
  function handleTap(x, y) {
    let best = null, bestCz = Infinity;
    for (const p of PLANETS) {
      if (!p.alive || !p.screen.visible) continue;
      const d = Math.hypot(p.screen.x - x, p.screen.y - y);
      if (d < Math.max(p.screen.r + 16, 24) && p.screen.cz < bestCz) { bestCz = p.screen.cz; best = p; }
    }
    if (!best && SUN.screen.visible) {
      const d = Math.hypot(SUN.screen.x - x, SUN.screen.y - y);
      if (d < Math.max(SUN.screen.r + 16, 26)) best = SUN;
    }
    if (best) selectBody(best); else deselect();
  }

  // ---------- Pointer: drag to aim, tap to scan ----------
  let dragging = false, moved = false, downX = 0, downY = 0, lastX = 0, lastY = 0, downTime = 0;
  function getPoint(e) {
    const rect = canvas.getBoundingClientRect();
    const src = (e.touches && e.touches[0]) || e;
    return { x: src.clientX - rect.left, y: src.clientY - rect.top };
  }
  function onDown(e) {
    dragging = true; moved = false;
    const pt = getPoint(e);
    downX = lastX = pt.x; downY = lastY = pt.y; downTime = performance.now();
    if (canvas.setPointerCapture && e.pointerId != null) canvas.setPointerCapture(e.pointerId);
  }
  function onMove(e) {
    if (!dragging) return;
    const pt = getPoint(e);
    const dx = pt.x - lastX, dy = pt.y - lastY;
    lastX = pt.x; lastY = pt.y;
    if (Math.abs(pt.x - downX) + Math.abs(pt.y - downY) > 6) moved = true;
    if (mode === "explore") {
      orbAzim -= dx * 0.005;
      orbElev -= dy * 0.005;                 // drag down → swing toward a side view
      orbElev = Math.max(0.08, Math.min(1.54, orbElev));
    } else {
      yaw += dx * 0.0032;
      pitch -= dy * 0.0032;
      pitch = Math.max(-1.4, Math.min(1.4, pitch));
    }
    hideHint();
  }
  function onUp() {
    if (!dragging) return;
    dragging = false;
    if (!moved && performance.now() - downTime < 400) handleTap(downX, downY);
  }

  // ---------- Controls ----------
  const playBtn = document.getElementById("playBtn");
  const fireBtn = document.getElementById("fireBtn");
  const counterEl = document.getElementById("counter");
  const respawnBtn = document.getElementById("respawnBtn");
  const menuBtn = document.getElementById("menuBtn");
  const hudTitle = document.getElementById("hudTitle");
  const startScreen = document.getElementById("startScreen");

  playBtn.addEventListener("click", () => { paused = !paused; playBtn.textContent = paused ? "▶" : "⏸"; });
  document.getElementById("speed").addEventListener("input", (e) => { speedMul = e.target.value / 100; });
  respawnBtn.addEventListener("click", () => {
    for (const p of PLANETS) p.alive = true;
    particles.length = 0; rings.length = 0;
    hideHint();
  });
  fireBtn.addEventListener("pointerdown", (e) => { e.preventDefault(); fire(); });
  window.addEventListener("keydown", (e) => {
    if (e.code === "Space") { e.preventDefault(); fire(); }
  });

  // ---------- Modes / start screen ----------
  function applyModeUI() {
    const blaster = mode === "blaster";
    fireBtn.style.display = blaster ? "" : "none";
    counterEl.style.display = blaster ? "" : "none";
    respawnBtn.style.display = blaster ? "" : "none";
    hudTitle.textContent = blaster ? "Sonnensystem — Blaster" : "Sonnensystem — Erkunden";
  }
  function startMode(m) {
    mode = m;
    for (const p of PLANETS) p.alive = true;
    particles.length = 0; rings.length = 0; beams.length = 0;
    deselect();
    paused = false; playBtn.textContent = "⏸";
    if (m === "explore") { orbAzim = 0; orbElev = 1.5; }   // start from the top
    else { yaw = 0; pitch = -0.172; }
    applyModeUI();
    startScreen.classList.add("hidden");
    showHint(m === "blaster"
      ? "Ziehen zum Zielen  •  FEUER (oder Leertaste) zerstört  •  Tippe einen Planeten zum Scannen"
      : "Ziehen, um von allen Seiten zu schauen  •  Tippe einen Planeten oder die Sonne für Fakten");
  }
  function showStartScreen() { startScreen.classList.remove("hidden"); }

  document.querySelectorAll(".mode-card").forEach((btn) => {
    btn.addEventListener("click", () => startMode(btn.dataset.mode));
  });
  menuBtn.addEventListener("click", showStartScreen);

  // ---------- Hint ----------
  const hintEl = document.getElementById("hint");
  let hintTimer = null;
  function hideHint() {
    hintEl.style.opacity = "0";
    clearTimeout(hintTimer);
  }
  function showHint(text) {
    hintEl.textContent = text;
    hintEl.style.display = "";
    hintEl.style.opacity = "1";
    clearTimeout(hintTimer);
    hintTimer = setTimeout(hideHint, 6500);
  }

  // ---------- Events ----------
  window.addEventListener("resize", resize);
  window.addEventListener("orientationchange", () => setTimeout(resize, 150));
  if (window.PointerEvent) {
    canvas.addEventListener("pointerdown", onDown);
    window.addEventListener("pointermove", onMove);
    window.addEventListener("pointerup", onUp);
    window.addEventListener("pointercancel", onUp);
  } else {
    canvas.addEventListener("touchstart", onDown, { passive: true });
    window.addEventListener("touchmove", onMove, { passive: true });
    window.addEventListener("touchend", onUp);
    canvas.addEventListener("mousedown", onDown);
    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseup", onUp);
  }

  // ---------- Go ----------
  resize();
  makeStars();
  applyModeUI();        // start screen is up; hide blaster-only UI until a mode is picked
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
