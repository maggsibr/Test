<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>Penalty Shootout</title>
<style>
  :root {
    --grass1: #4caf50;
    --grass2: #43a047;
    --accent: #ffd54f;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #0b1d12;
    user-select: none; -webkit-user-select: none; touch-action: none;
  }
  #game {
    position: relative;
    width: 100vw; height: 100vh;
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  canvas { display: block; touch-action: none; }

  /* HUD */
  #hud {
    position: absolute; top: 0; left: 0; right: 0;
    padding: 14px 18px;
    display: flex; align-items: center; justify-content: space-between;
    pointer-events: none;
    color: #fff;
    text-shadow: 0 2px 6px rgba(0,0,0,.5);
    z-index: 5;
  }
  .hud-card {
    background: rgba(0,0,0,.32);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border-radius: 14px;
    padding: 8px 14px;
    line-height: 1.15;
  }
  .hud-card .big { font-size: 22px; font-weight: 700; }
  .hud-card .small { font-size: 12px; opacity: .85; letter-spacing: .3px; text-transform: uppercase; }
  #shotTrack {
    display: flex; gap: 6px; margin-top: 6px;
  }
  .pip {
    width: 12px; height: 12px; border-radius: 50%;
    background: rgba(255,255,255,.25);
    border: 1px solid rgba(255,255,255,.4);
  }
  .pip.goal { background: #4ade80; border-color:#22c55e; }
  .pip.miss { background: #f87171; border-color:#ef4444; }

  /* Banner / message */
  #message {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%,-50%) scale(.8);
    opacity: 0;
    pointer-events: none;
    z-index: 6;
    font-size: 56px; font-weight: 800; color: #fff;
    text-shadow: 0 4px 18px rgba(0,0,0,.6);
    transition: transform .25s cubic-bezier(.2,1.4,.5,1), opacity .25s;
    text-align: center;
  }
  #message.show { opacity: 1; transform: translate(-50%,-50%) scale(1); }
  #message.goal { color: #4ade80; }
  #message.save { color: #fbbf24; }
  #message.miss { color: #f87171; }

  /* Hint */
  #hint {
    position: absolute; bottom: 26px; left: 50%; transform: translateX(-50%);
    color: #fff; font-size: 15px; background: rgba(0,0,0,.32);
    padding: 8px 16px; border-radius: 999px; z-index: 5;
    text-shadow: 0 1px 3px rgba(0,0,0,.5);
    transition: opacity .3s;
  }

  /* Overlay (winner / play again) */
  #overlay {
    position: absolute; inset: 0; z-index: 10;
    background: rgba(4,12,8,.78);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; color: #fff;
    opacity: 0; pointer-events: none;
    transition: opacity .4s;
  }
  #overlay.show { opacity: 1; pointer-events: auto; }
  #overlay h1 { font-size: clamp(40px, 9vw, 84px); margin: 0 0 6px; }
  #overlay .sub { font-size: clamp(18px,4vw,26px); opacity: .9; margin-bottom: 8px; }
  #overlay .finalScore { font-size: clamp(28px,6vw,40px); font-weight: 800; margin: 8px 0 28px; letter-spacing: 2px; }
  #playAgain {
    font-size: 22px; font-weight: 700; color: #062;
    background: var(--accent);
    border: none; border-radius: 999px;
    padding: 16px 40px; cursor: pointer;
    box-shadow: 0 8px 24px rgba(0,0,0,.35);
    transition: transform .12s;
  }
  #playAgain:active { transform: scale(.95); }
</style>
</head>
<body>
<div id="game">
  <canvas id="canvas"></canvas>

  <div id="hud">
    <div class="hud-card">
      <div class="small">You</div>
      <div class="big" id="scoreYou">0</div>
      <div id="shotTrack"></div>
    </div>
    <div class="hud-card" style="text-align:center">
      <div class="small">Penalty</div>
      <div class="big" id="shotNum">1 / 5</div>
    </div>
    <div class="hud-card" style="text-align:right">
      <div class="small">Keeper</div>
      <div class="big" id="scoreKeeper">0</div>
      <div class="small" style="margin-top:6px" id="resultTally">0 goals · 0 saved</div>
    </div>
  </div>

  <div id="message"></div>
  <div id="hint">Drag from the ball to aim &amp; set power — release to shoot</div>

  <div id="overlay">
    <h1 id="winTitle">You Win!</h1>
    <div class="sub" id="winSub">Great shooting</div>
    <div class="finalScore" id="finalScore">3 – 1</div>
    <button id="playAgain">Play again</button>
  </div>
</div>

<script>
(() => {
  "use strict";

  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");

  // ---- Layout / sizing ----
  let W = 0, H = 0, DPR = 1;
  // Field reference geometry (computed on resize)
  const field = {};

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2.5);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    computeField();
  }

  function computeField() {
    // Goal sits in upper-middle of screen. Ball near bottom center.
    const goalW = Math.min(W * 0.62, 560);
    const goalH = goalW * 0.42;
    const goalX = (W - goalW) / 2;
    // Horizon line where ground meets backdrop
    field.horizonY = H * 0.30;
    field.goalX = goalX;
    field.goalY = field.horizonY + H * 0.04;
    field.goalW = goalW;
    field.goalH = goalH;
    field.postT = Math.max(6, goalW * 0.016); // post thickness
    // Ball start
    field.ballStartX = W / 2;
    field.ballStartY = H * 0.86;
    field.ballR = Math.max(16, Math.min(W, H) * 0.032);
    // Goal mouth (inside of posts) for scoring
    field.mouthX = goalX + field.postT;
    field.mouthW = goalW - field.postT * 2;
    field.mouthY = field.goalY + field.postT;
    field.mouthH = goalH - field.postT;
  }

  // ---- Game state ----
  const TOTAL_SHOTS = 5;
  let state = "aiming"; // aiming | shooting | resolving | over
  let shotIndex = 0;    // 0-based current penalty
  let youScore = 0, keeperScore = 0;
  let goals = 0, savedOrMissed = 0;
  const results = []; // 'goal' | 'miss'

  // Ball
  const ball = {
    x: 0, y: 0, r: 0,
    scale: 1,           // visual scale = perceived distance (1 near, smaller far)
    spin: 0,
    flying: false,
  };

  // Keeper
  const keeper = {
    // position relative to goal mouth, x in 0..1 across mouth, baseline standing
    dive: 0,            // current horizontal offset factor -1..1
    targetDive: 0,
    jump: 0,            // vertical jump 0..1
    targetJump: 0,
    chosen: false,
    decisionTime: 0,
  };

  // Aim
  let aiming = false;
  let aimStart = null;   // {x,y}
  let aimCur = null;     // {x,y}

  // Net wobble
  let netWobble = 0;     // amplitude
  let netWobbleT = 0;

  // Shot animation params
  let shot = null;

  function resetBall() {
    ball.x = field.ballStartX;
    ball.y = field.ballStartY;
    ball.r = field.ballR;
    ball.scale = 1;
    ball.spin = 0;
    ball.flying = false;
  }

  function newGame() {
    shotIndex = 0;
    youScore = keeperScore = 0;
    goals = savedOrMissed = 0;
    results.length = 0;
    state = "aiming";
    keeper.dive = keeper.targetDive = 0;
    keeper.jump = keeper.targetJump = 0;
    keeper.chosen = false;
    resetBall();
    updateHUD();
    overlay.classList.remove("show");
    showHint(true);
  }

  // ---- HUD ----
  const scoreYouEl = document.getElementById("scoreYou");
  const scoreKeeperEl = document.getElementById("scoreKeeper");
  const shotNumEl = document.getElementById("shotNum");
  const tallyEl = document.getElementById("resultTally");
  const trackEl = document.getElementById("shotTrack");
  const messageEl = document.getElementById("message");
  const overlay = document.getElementById("overlay");
  const hintEl = document.getElementById("hint");

  function updateHUD() {
    scoreYouEl.textContent = youScore;
    scoreKeeperEl.textContent = keeperScore;
    shotNumEl.textContent = Math.min(shotIndex + 1, TOTAL_SHOTS) + " / " + TOTAL_SHOTS;
    tallyEl.textContent = goals + (goals === 1 ? " goal · " : " goals · ") + savedOrMissed + " stopped";
    // pips
    trackEl.innerHTML = "";
    for (let i = 0; i < TOTAL_SHOTS; i++) {
      const p = document.createElement("div");
      p.className = "pip";
      if (results[i] === "goal") p.classList.add("goal");
      else if (results[i] === "miss") p.classList.add("miss");
      trackEl.appendChild(p);
    }
  }

  function showHint(show) {
    hintEl.style.opacity = show ? "1" : "0";
  }

  function flashMessage(text, type) {
    messageEl.textContent = text;
    messageEl.className = "";
    messageEl.classList.add(type, "show");
    setTimeout(() => messageEl.classList.remove("show"), 1100);
  }

  // ---- Input ----
  function pointFromEvent(e) {
    const t = e.touches ? e.touches[0] : e;
    return { x: t.clientX, y: t.clientY };
  }

  function onDown(e) {
    if (state !== "aiming") return;
    const p = pointFromEvent(e);
    // Must start near the ball
    const d = Math.hypot(p.x - ball.x, p.y - ball.y);
    if (d > ball.r * 3.2) return;
    e.preventDefault();
    aiming = true;
    aimStart = { x: ball.x, y: ball.y };
    aimCur = p;
    showHint(false);
  }

  function onMove(e) {
    if (!aiming) return;
    e.preventDefault();
    aimCur = pointFromEvent(e);
  }

  function onUp(e) {
    if (!aiming) return;
    e.preventDefault();
    aiming = false;
    const dx = aimCur.x - aimStart.x;
    const dy = aimCur.y - aimStart.y;
    const dragLen = Math.hypot(dx, dy);
    if (dragLen < ball.r * 0.6 || dy > -8) {
      // too small or dragged downward — cancel
      aimStart = aimCur = null;
      return;
    }
    launchShot(dx, dy, dragLen);
  }

  canvas.addEventListener("touchstart", onDown, { passive: false });
  canvas.addEventListener("touchmove", onMove, { passive: false });
  canvas.addEventListener("touchend", onUp, { passive: false });
  canvas.addEventListener("mousedown", onDown);
  window.addEventListener("mousemove", onMove);
  window.addEventListener("mouseup", onUp);

  // ---- Shooting ----
  function launchShot(dx, dy, dragLen) {
    state = "shooting";

    // Aim direction. Horizontal aim mapped to goal target x.
    // Use drag angle to set landing x within (and slightly beyond) the goal.
    const maxDrag = Math.min(W, H) * 0.42;
    const power = Math.min(dragLen / maxDrag, 1); // 0..1

    // Horizontal target: drag right aims right, drag left aims left.
    // Allow overshoot so you can miss wide.
    const targetXFactor = (dx / (maxDrag * 0.7)); // -1..1 (can exceed)
    // Vertical: more vertical drag + power -> higher / further. Map to target height.
    const targetYFactor = Math.min(Math.abs(dy) / (maxDrag * 0.85), 1.15); // 0..~1.15

    // Compute landing point in screen space at the goal plane.
    const mouthCx = field.mouthX + field.mouthW / 2;
    const landX = mouthCx + targetXFactor * (field.mouthW * 0.62);
    // Height: low shots near goal line, high shots near crossbar (can go over)
    const goalLineY = field.mouthY + field.mouthH;
    const landY = goalLineY - targetYFactor * (field.mouthH * 1.02);

    // Flight time based on power (more power = faster)
    const duration = 720 - power * 300; // ms

    shot = {
      t0: performance.now(),
      duration,
      fromX: ball.x, fromY: ball.y,
      landX, landY,
      power,
      targetXFactor,
      // apex height for arc
      arc: Math.min(0.5 + targetYFactor * 0.5, 1) * (H * 0.10) * (0.6 + power * 0.7),
      spinDir: Math.sign(dx) || 1,
      resolved: false,
      saved: false,
      scored: false,
      onTarget: false,
    };

    ball.flying = true;

    // Keeper decides where to dive (with a slight reaction delay so it commits).
    decideKeeper(targetXFactor);
  }

  function decideKeeper(playerTargetXFactor) {
    // Keeper guesses a side. Make beatable but not trivial.
    // 38% left, 38% right, 24% center-ish. Plus a small chance it "reads" the shot.
    const r = Math.random();
    let guess; // -1 left, 0 center, 1 right
    if (r < 0.38) guess = -1;
    else if (r < 0.76) guess = 1;
    else guess = 0;

    // ~22% chance the keeper reads your direction and guesses correctly.
    if (Math.random() < 0.22) {
      guess = playerTargetXFactor < -0.18 ? -1 : playerTargetXFactor > 0.18 ? 1 : 0;
    }

    keeper.guess = guess;
    keeper.targetDive = guess * 0.92;
    // Keeper jumps a bit for side dives, less for center
    keeper.targetJump = guess === 0 ? 0.12 : 0.85;
    keeper.chosen = true;
    keeper.decisionTime = performance.now() + 60; // commit almost immediately
  }

  function resolveShot() {
    if (shot.resolved) return;
    shot.resolved = true;

    // Was it on target (inside goal mouth)?
    const insideX = shot.landX > field.mouthX + ball.r * 0.3 && shot.landX < field.mouthX + field.mouthW - ball.r * 0.3;
    const insideY = shot.landY > field.mouthY - ball.r * 0.2 && shot.landY < field.mouthY + field.mouthH + ball.r * 0.2;
    const onTarget = insideX && insideY;
    shot.onTarget = onTarget;

    let saved = false;
    if (onTarget) {
      // Keeper covers a region around its hands. Compute keeper hand x at goal plane.
      const mouthCx = field.mouthX + field.mouthW / 2;
      const keeperX = mouthCx + keeper.dive * (field.mouthW * 0.42);
      const keeperReachX = field.mouthW * 0.20; // horizontal reach
      // Keeper can reach low/mid; very high or very low corners are harder to save.
      const goalLineY = field.mouthY + field.mouthH;
      const shotHeight = (goalLineY - shot.landY) / field.mouthH; // 0 low .. 1 top
      let reachX = keeperReachX;
      // Diving keepers reach further horizontally; standing keeper covers center well.
      if (keeper.guess === 0) {
        reachX = field.mouthW * 0.16;
      }
      const dxToKeeper = Math.abs(shot.landX - keeperX);
      // Vertical: keeper saves better in mid heights; top-corner & ground-corner harder.
      let vertCover = 1;
      if (shotHeight > 0.72) vertCover = 0.45;       // top corner
      else if (shotHeight < 0.12) vertCover = 0.7;   // along the ground
      if (keeper.guess === 0 && shotHeight > 0.5) vertCover *= 0.6; // center keeper weak up high

      if (dxToKeeper < reachX && Math.random() < vertCover) {
        saved = true;
      }
    }

    if (onTarget && !saved) {
      shot.scored = true;
      youScore++; goals++; results[shotIndex] = "goal";
      triggerNetWobble();
      flashMessage("GOAL!", "goal");
    } else if (onTarget && saved) {
      shot.saved = true;
      keeperScore++; savedOrMissed++; results[shotIndex] = "miss";
      // make keeper snap to ball for save feel
      flashMessage("SAVED!", "save");
    } else {
      keeperScore++; savedOrMissed++; results[shotIndex] = "miss";
      flashMessage("MISS!", "miss");
    }
    updateHUD();

    state = "resolving";
    setTimeout(nextShot, 1300);
  }

  function nextShot() {
    shotIndex++;
    if (shotIndex >= TOTAL_SHOTS) {
      endGame();
      return;
    }
    // reset for next
    keeper.dive = keeper.targetDive = 0;
    keeper.jump = keeper.targetJump = 0;
    keeper.chosen = false;
    keeper.guess = undefined;
    shot = null;
    resetBall();
    state = "aiming";
    updateHUD();
    showHint(true);
    setTimeout(() => showHint(false), 2500);
  }

  function endGame() {
    state = "over";
    const win = youScore > keeperScore;
    const draw = youScore === keeperScore;
    const title = document.getElementById("winTitle");
    const sub = document.getElementById("winSub");
    const fs = document.getElementById("finalScore");
    fs.textContent = youScore + " – " + keeperScore;
    if (win) {
      title.textContent = "You Win! 🏆";
      sub.textContent = "Clinical from the spot.";
    } else if (draw) {
      title.textContent = "It's a Draw";
      sub.textContent = "Honours even.";
    } else {
      title.textContent = "Keeper Wins";
      sub.textContent = "Beaten by the gloves.";
    }
    overlay.classList.add("show");
  }

  document.getElementById("playAgain").addEventListener("click", newGame);

  function triggerNetWobble() {
    netWobble = 1;
    netWobbleT = performance.now();
  }

  // ---- Rendering ----
  function draw(now) {
    ctx.clearRect(0, 0, W, H);
    drawBackground();
    drawGoalBack();
    drawNet(now);
    drawKeeper(now);
    drawGoalPosts();
    updateBall(now);
    drawAim();
    drawBall(now);
    requestAnimationFrame(draw);
  }

  function drawBackground() {
    // Sky / stadium backdrop
    const sky = ctx.createLinearGradient(0, 0, 0, field.horizonY);
    sky.addColorStop(0, "#1a2a44");
    sky.addColorStop(1, "#2e4a6b");
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, field.horizonY);

    // crowd band
    ctx.fillStyle = "#22324a";
    ctx.fillRect(0, field.horizonY - H * 0.10, W, H * 0.10);
    // speckles for crowd
    ctx.save();
    ctx.globalAlpha = 0.5;
    for (let i = 0; i < 60; i++) {
      const cx = (i * 53.3 % W);
      const cy = field.horizonY - H * 0.10 + ((i * 31) % (H * 0.10));
      ctx.fillStyle = ["#e74c3c","#f1c40f","#3498db","#ecf0f1","#2ecc71"][i % 5];
      ctx.fillRect(cx, cy, 3, 3);
    }
    ctx.restore();

    // Grass with perspective stripes
    const grad = ctx.createLinearGradient(0, field.horizonY, 0, H);
    grad.addColorStop(0, "#2f7d36");
    grad.addColorStop(1, "#3fa34a");
    ctx.fillStyle = grad;
    ctx.fillRect(0, field.horizonY, W, H - field.horizonY);

    // Horizontal depth stripes
    for (let i = 0; i < 8; i++) {
      const a = i / 8, b = (i + 1) / 8;
      const yA = field.horizonY + (H - field.horizonY) * a * a;
      const yB = field.horizonY + (H - field.horizonY) * b * b;
      if (i % 2 === 0) {
        ctx.fillStyle = "rgba(255,255,255,0.045)";
        ctx.fillRect(0, yA, W, yB - yA);
      }
    }

    // Penalty arc & spot
    ctx.strokeStyle = "rgba(255,255,255,0.55)";
    ctx.lineWidth = Math.max(2, W * 0.004);
    ctx.beginPath();
    ctx.ellipse(W/2, field.ballStartY + ball.r*0.2, field.goalW*0.30, field.goalH*0.10, 0, Math.PI*1.15, Math.PI*1.85);
    ctx.stroke();
    // spot
    ctx.fillStyle = "rgba(255,255,255,0.8)";
    ctx.beginPath();
    ctx.ellipse(W/2, field.ballStartY + ball.r*1.05, ball.r*0.28, ball.r*0.12, 0, 0, Math.PI*2);
    ctx.fill();
  }

  function drawGoalBack() {
    // subtle shadow behind goal mouth (depth)
    ctx.save();
    ctx.fillStyle = "rgba(0,0,0,0.18)";
    ctx.fillRect(field.mouthX, field.mouthY, field.mouthW, field.mouthH);
    ctx.restore();
  }

  function drawNet(now) {
    // Net inside the goal mouth, with wobble when scored.
    let wob = 0;
    if (netWobble > 0) {
      const dt = (now - netWobbleT) / 1000;
      wob = Math.exp(-dt * 4) * Math.sin(dt * 26) * (field.goalW * 0.018);
      if (dt > 1.4) netWobble = 0;
    }
    ctx.save();
    ctx.beginPath();
    ctx.rect(field.mouthX, field.mouthY, field.mouthW, field.mouthH);
    ctx.clip();

    ctx.strokeStyle = "rgba(255,255,255,0.28)";
    ctx.lineWidth = 1;
    const cell = Math.max(14, field.goalW * 0.035);
    const x0 = field.mouthX, y0 = field.mouthY;
    const x1 = field.mouthX + field.mouthW, y1 = field.mouthY + field.mouthH;

    for (let x = x0; x <= x1 + cell; x += cell) {
      const sway = wob * Math.sin((x - x0) / field.mouthW * Math.PI);
      ctx.beginPath();
      ctx.moveTo(x, y0);
      ctx.lineTo(x + sway, y1);
      ctx.stroke();
    }
    for (let y = y0; y <= y1 + cell; y += cell) {
      const t = (y - y0) / field.mouthH;
      const sway = wob * Math.sin(t * Math.PI) * 0.6;
      ctx.beginPath();
      ctx.moveTo(x0, y);
      ctx.lineTo(x1, y + sway);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawGoalPosts() {
    ctx.save();
    ctx.fillStyle = "#f7f7f7";
    ctx.shadowColor = "rgba(0,0,0,0.35)";
    ctx.shadowBlur = 8;
    ctx.shadowOffsetY = 3;
    const t = field.postT;
    // left post
    ctx.fillRect(field.goalX, field.goalY, t, field.goalH);
    // right post
    ctx.fillRect(field.goalX + field.goalW - t, field.goalY, t, field.goalH);
    // crossbar
    ctx.fillRect(field.goalX, field.goalY, field.goalW, t);
    ctx.restore();
  }

  function drawKeeper(now) {
    // Animate dive/jump toward targets
    keeper.dive += (keeper.targetDive - keeper.dive) * 0.18;
    keeper.jump += (keeper.targetJump - keeper.jump) * 0.18;

    const mouthCx = field.mouthX + field.mouthW / 2;
    const kx = mouthCx + keeper.dive * (field.mouthW * 0.42);
    const baseY = field.mouthY + field.mouthH; // goal line
    const jumpPx = keeper.jump * field.mouthH * 0.55;
    const ky = baseY - jumpPx;

    const bodyH = field.mouthH * 0.62;
    const bodyW = bodyH * 0.34;

    ctx.save();
    ctx.translate(kx, ky);

    // shadow on ground
    ctx.save();
    ctx.translate(0, baseY - ky);
    ctx.globalAlpha = 0.25 * (1 - keeper.jump * 0.6);
    ctx.fillStyle = "#000";
    ctx.beginPath();
    ctx.ellipse(0, 0, bodyW * 1.3, bodyW * 0.4, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // lean in dive direction
    const lean = keeper.dive * 0.5;
    ctx.rotate(lean);

    const kit = "#ff5a3c";
    const kitDark = "#e0431f";

    // legs
    ctx.fillStyle = "#222";
    ctx.fillRect(-bodyW*0.36, 0, bodyW*0.3, bodyH*0.42);
    ctx.fillRect(bodyW*0.06, 0, bodyW*0.3, bodyH*0.42);

    // body
    ctx.fillStyle = kit;
    roundRect(ctx, -bodyW/2, -bodyH*0.55, bodyW, bodyH*0.62, bodyW*0.25);
    ctx.fill();

    // arms raised (spread wider when diving/jumping)
    ctx.strokeStyle = kit;
    ctx.lineWidth = bodyW * 0.32;
    ctx.lineCap = "round";
    const armSpread = 0.6 + keeper.jump * 0.7;
    const armY = -bodyH*0.42;
    const handLen = bodyH * 0.5 * (0.7 + keeper.jump*0.5);
    ctx.beginPath();
    ctx.moveTo(-bodyW*0.30, armY);
    ctx.lineTo(-bodyW*0.30 - handLen*armSpread, armY - handLen*0.7);
    ctx.moveTo(bodyW*0.30, armY);
    ctx.lineTo(bodyW*0.30 + handLen*armSpread, armY - handLen*0.7);
    ctx.stroke();
    // gloves
    ctx.fillStyle = "#fff";
    ctx.beginPath();
    ctx.arc(-bodyW*0.30 - handLen*armSpread, armY - handLen*0.7, bodyW*0.22, 0, Math.PI*2);
    ctx.arc(bodyW*0.30 + handLen*armSpread, armY - handLen*0.7, bodyW*0.22, 0, Math.PI*2);
    ctx.fill();

    // head
    ctx.fillStyle = "#f1c27d";
    ctx.beginPath();
    ctx.arc(0, -bodyH*0.66, bodyW*0.34, 0, Math.PI*2);
    ctx.fill();

    ctx.restore();
  }

  function roundRect(ctx, x, y, w, h, r) {
    r = Math.min(r, w/2, h/2);
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.arcTo(x+w, y, x+w, y+h, r);
    ctx.arcTo(x+w, y+h, x, y+h, r);
    ctx.arcTo(x, y+h, x, y, r);
    ctx.arcTo(x, y, x+w, y, r);
    ctx.closePath();
  }

  function updateBall(now) {
    if (state === "aiming") {
      ball.x = field.ballStartX;
      ball.y = field.ballStartY;
      ball.scale = 1;
      return;
    }
    if (!shot || !ball.flying) return;
    const tRaw = (now - shot.t0) / shot.duration;
    const t = Math.min(tRaw, 1);
    // ease out slightly
    const et = t;
    ball.x = shot.fromX + (shot.landX - shot.fromX) * et;
    // base vertical interpolation + arc (parabola peaks mid-flight)
    const baseY = shot.fromY + (shot.landY - shot.fromY) * et;
    const arc = Math.sin(t * Math.PI) * shot.arc;
    ball.y = baseY - arc;
    // perspective shrink as it goes away
    ball.scale = 1 - 0.55 * et;
    ball.spin += 0.4 * shot.spinDir;

    if (tRaw >= 1 && !shot.resolved) {
      resolveShot();
    }
  }

  function drawBall(now) {
    const r = ball.r * ball.scale;
    // ground shadow
    if (state !== "aiming") {
      ctx.save();
      ctx.globalAlpha = 0.22 * ball.scale;
      ctx.fillStyle = "#000";
      ctx.beginPath();
      const shY = (field.mouthY + field.mouthH) + r*0.4;
      ctx.ellipse(ball.x, Math.max(ball.y + r*1.4, ball.y + r), r*1.0, r*0.35, 0, 0, Math.PI*2);
      ctx.fill();
      ctx.restore();
    }

    ctx.save();
    ctx.translate(ball.x, ball.y);
    ctx.rotate(ball.spin);

    // ball base
    const g = ctx.createRadialGradient(-r*0.3, -r*0.3, r*0.2, 0, 0, r);
    g.addColorStop(0, "#ffffff");
    g.addColorStop(1, "#d8d8d8");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI*2);
    ctx.fill();

    // pentagon-ish spots
    ctx.fillStyle = "#1b1b1b";
    const spots = 5;
    ctx.beginPath();
    ctx.arc(0, 0, r*0.26, 0, Math.PI*2);
    ctx.fill();
    for (let i = 0; i < spots; i++) {
      const a = (i / spots) * Math.PI * 2;
      const px = Math.cos(a) * r * 0.62;
      const py = Math.sin(a) * r * 0.62;
      ctx.beginPath();
      ctx.arc(px, py, r*0.14, 0, Math.PI*2);
      ctx.fill();
    }
    // rim
    ctx.strokeStyle = "rgba(0,0,0,0.15)";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(0, 0, r*0.98, 0, Math.PI*2);
    ctx.stroke();

    ctx.restore();
  }

  function drawAim() {
    if (!aiming || !aimStart || !aimCur) return;
    const dx = aimCur.x - aimStart.x;
    const dy = aimCur.y - aimStart.y;
    const len = Math.hypot(dx, dy);
    const maxDrag = Math.min(W, H) * 0.42;
    const power = Math.min(len / maxDrag, 1);

    // The shot goes OPPOSITE-ish? No: drag from ball toward target. Show line from ball to pointer,
    // and a projected aim point toward the goal.
    const ang = Math.atan2(dy, dx);

    // Projected direction (ball travels in drag direction)
    ctx.save();

    // Power arc / line
    ctx.strokeStyle = `rgba(255, ${Math.round(213 - power*120)}, 79, 0.9)`;
    ctx.lineWidth = Math.max(4, ball.r * 0.35);
    ctx.lineCap = "round";
    ctx.setLineDash([ball.r*0.5, ball.r*0.45]);
    ctx.beginPath();
    ctx.moveTo(ball.x, ball.y);
    ctx.lineTo(aimCur.x, aimCur.y);
    ctx.stroke();
    ctx.setLineDash([]);

    // Arrowhead at pointer
    const ah = ball.r * 0.7;
    ctx.fillStyle = `rgba(255, ${Math.round(213 - power*120)}, 79, 0.95)`;
    ctx.translate(aimCur.x, aimCur.y);
    ctx.rotate(ang);
    ctx.beginPath();
    ctx.moveTo(ah, 0);
    ctx.lineTo(-ah*0.4, ah*0.55);
    ctx.lineTo(-ah*0.4, -ah*0.55);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    // Power meter ring around the ball
    ctx.save();
    ctx.translate(ball.x, ball.y);
    ctx.strokeStyle = "rgba(255,255,255,0.25)";
    ctx.lineWidth = ball.r*0.28;
    ctx.beginPath();
    ctx.arc(0, 0, ball.r*1.5, 0, Math.PI*2);
    ctx.stroke();
    // power fill
    const hue = 120 - power*120; // green->red
    ctx.strokeStyle = `hsl(${hue}, 85%, 55%)`;
    ctx.lineWidth = ball.r*0.28;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.arc(0, 0, ball.r*1.5, -Math.PI/2, -Math.PI/2 + power*Math.PI*2);
    ctx.stroke();
    ctx.restore();
  }

  // ---- Boot ----
  window.addEventListener("resize", () => { resize(); if (state === "aiming") resetBall(); });
  window.addEventListener("orientationchange", () => setTimeout(() => { resize(); if (state==="aiming") resetBall(); }, 200));

  resize();
  newGame();
  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
