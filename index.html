<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>Penalty Shootout</title>
<style>
  :root {
    --grass1: #4caf50;
    --grass2: #43a047;
    --accent: #ffd54f;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #0b1d12;
    user-select: none; -webkit-user-select: none; touch-action: none;
  }
  #game {
    position: relative;
    width: 100vw; height: 100vh;
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  canvas { display: block; touch-action: none; }

  /* HUD */
  #hud {
    position: absolute; top: 0; left: 0; right: 0;
    padding: 14px 18px;
    display: flex; align-items: flex-start; justify-content: space-between;
    pointer-events: none;
    color: #fff;
    text-shadow: 0 2px 6px rgba(0,0,0,.5);
    z-index: 5;
    opacity: 0; transition: opacity .3s;
  }
  #hud.show { opacity: 1; }
  .hud-card {
    background: rgba(0,0,0,.32);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border-radius: 14px;
    padding: 8px 14px;
    line-height: 1.15;
    min-width: 86px;
  }
  .hud-card .big { font-size: 22px; font-weight: 700; }
  .hud-card .small { font-size: 12px; opacity: .85; letter-spacing: .3px; text-transform: uppercase; }
  #shotTrack {
    display: flex; gap: 6px; margin-top: 6px;
  }
  .pip {
    width: 12px; height: 12px; border-radius: 50%;
    background: rgba(255,255,255,.25);
    border: 1px solid rgba(255,255,255,.4);
  }
  .pip.goal { background: #4ade80; border-color:#22c55e; }
  .pip.miss { background: #f87171; border-color:#ef4444; }

  /* Banner / message */
  #message {
    position: absolute; left: 50%; top: 46%;
    transform: translate(-50%,-50%) scale(.8);
    opacity: 0;
    pointer-events: none;
    z-index: 6;
    font-size: 56px; font-weight: 800; color: #fff;
    text-shadow: 0 4px 18px rgba(0,0,0,.6);
    transition: transform .25s cubic-bezier(.2,1.4,.5,1), opacity .25s;
    text-align: center;
  }
  #message.show { opacity: 1; transform: translate(-50%,-50%) scale(1); }
  #message.goal { color: #4ade80; }
  #message.save { color: #fbbf24; }
  #message.miss { color: #f87171; }

  /* Points popup */
  #pointsPopup {
    position: absolute; left: 50%; top: 58%;
    transform: translate(-50%, 0);
    font-size: clamp(20px, 5vw, 30px); font-weight: 800;
    color: var(--accent);
    opacity: 0; pointer-events: none; z-index: 6;
    text-shadow: 0 2px 10px rgba(0,0,0,.7); white-space: nowrap;
  }
  #pointsPopup.show { animation: ptsPop 1.25s ease-out forwards; }
  @keyframes ptsPop {
    0%   { opacity: 0; transform: translate(-50%, 16px) scale(.7); }
    18%  { opacity: 1; transform: translate(-50%, -2px) scale(1); }
    78%  { opacity: 1; }
    100% { opacity: 0; transform: translate(-50%, -56px) scale(1); }
  }

  /* Hint */
  #hint {
    position: absolute; bottom: 26px; left: 50%; transform: translateX(-50%);
    color: #fff; font-size: 15px; background: rgba(0,0,0,.32);
    padding: 8px 16px; border-radius: 999px; z-index: 5;
    text-shadow: 0 1px 3px rgba(0,0,0,.5);
    transition: opacity .3s; pointer-events: none; text-align: center;
  }

  /* Full-screen overlays (start + end) */
  .screen {
    position: absolute; inset: 0; z-index: 12;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; color: #fff; padding: 24px;
    background: radial-gradient(125% 90% at 50% 10%, rgba(24,46,78,.55), rgba(4,12,8,.88));
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    opacity: 0; pointer-events: none; transition: opacity .4s;
  }
  .screen.show { opacity: 1; pointer-events: auto; }

  /* Start screen */
  #startScreen .kicker {
    font-size: clamp(15px, 4vw, 22px); letter-spacing: .5em; font-weight: 700;
    color: var(--accent); margin-bottom: -4px; padding-left: .5em;
  }
  #startScreen h1 {
    font-size: clamp(46px, 12vw, 92px); margin: 0 0 4px; letter-spacing: 2px;
    font-weight: 900; text-shadow: 0 6px 22px rgba(0,0,0,.5);
  }
  .modeSelect {
    display: flex; gap: 8px; margin: 20px 0 10px; flex-wrap: wrap; justify-content: center;
  }
  .modeBtn {
    font-family: inherit; font-size: 16px; font-weight: 700; color: #fff;
    background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.18);
    border-radius: 999px; padding: 10px 22px; cursor: pointer; transition: all .15s;
  }
  .modeBtn.active { background: var(--accent); color: #053; border-color: var(--accent); }
  .modeDesc {
    max-width: 440px; font-size: 15px; line-height: 1.5; opacity: .85;
    min-height: 68px; margin: 4px 0;
  }
  .hiRow { font-size: 15px; opacity: .9; margin-bottom: 24px; }
  .hiRow span { color: var(--accent); font-weight: 800; }
  #startBtn {
    font-family: inherit; font-size: 24px; font-weight: 800; color: #053;
    background: var(--accent); border: none; border-radius: 999px;
    padding: 16px 56px; cursor: pointer; box-shadow: 0 10px 28px rgba(0,0,0,.4);
    transition: transform .12s;
  }
  #startBtn:active { transform: scale(.95); }

  /* End overlay */
  #overlay h1 { font-size: clamp(40px, 9vw, 84px); margin: 0 0 6px; }
  #overlay .sub { font-size: clamp(18px,4vw,26px); opacity: .9; margin-bottom: 8px; }
  #overlay .finalScore { font-size: clamp(28px,6vw,40px); font-weight: 800; margin: 8px 0 8px; letter-spacing: 2px; }
  #newBest {
    color: var(--accent); font-weight: 800; font-size: clamp(16px,4vw,22px);
    margin: 2px 0 18px; opacity: 0; transition: opacity .3s;
  }
  #newBest.show { opacity: 1; }
  .overlayBtns { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  #playAgain {
    font-family: inherit; font-size: 22px; font-weight: 700; color: #053;
    background: var(--accent); border: none; border-radius: 999px;
    padding: 15px 38px; cursor: pointer; box-shadow: 0 8px 24px rgba(0,0,0,.35);
    transition: transform .12s;
  }
  #menuBtn {
    font-family: inherit; font-size: 22px; font-weight: 700; color: #fff;
    background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.22);
    border-radius: 999px; padding: 15px 34px; cursor: pointer; transition: transform .12s;
  }
  #playAgain:active, #menuBtn:active { transform: scale(.95); }

  /* Mute toggle */
  #muteBtn {
    position: absolute; bottom: 18px; right: 18px; z-index: 14;
    width: 48px; height: 48px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,.25); background: rgba(0,0,0,.42);
    color: #fff; font-size: 20px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  #muteBtn:active { transform: scale(.92); }
</style>
</head>
<body>
<div id="game">
  <canvas id="canvas"></canvas>

  <div id="hud">
    <div class="hud-card" id="cardLeft">
      <div class="small" id="leftLabel">You</div>
      <div class="big" id="leftVal">0</div>
      <div id="shotTrack"></div>
    </div>
    <div class="hud-card" id="cardCenter" style="text-align:center">
      <div class="small" id="centerLabel">Penalty</div>
      <div class="big" id="centerVal">1 / 5</div>
    </div>
    <div class="hud-card" id="cardRight" style="text-align:right">
      <div class="small" id="rightLabel">Keeper</div>
      <div class="big" id="rightVal">0</div>
      <div class="small" id="rightSub" style="margin-top:6px">Best 0/5</div>
    </div>
  </div>

  <div id="message"></div>
  <div id="pointsPopup"></div>
  <div id="hint">Drag from the ball to aim &amp; set power — release to shoot</div>

  <!-- Start screen -->
  <div id="startScreen" class="screen">
    <div class="kicker">⚽ PENALTY</div>
    <h1>SHOOTOUT</h1>
    <div class="modeSelect" id="modeSelect">
      <button class="modeBtn active" data-mode="classic">Classic</button>
      <button class="modeBtn" data-mode="competition">Competition</button>
      <button class="modeBtn" data-mode="survival">Survival</button>
    </div>
    <div class="modeDesc" id="modeDesc"></div>
    <div class="hiRow">Best: <span id="startHigh">—</span></div>
    <button id="startBtn">Start</button>
  </div>

  <!-- End overlay -->
  <div id="overlay" class="screen">
    <h1 id="winTitle">You Win!</h1>
    <div class="sub" id="winSub">Great shooting</div>
    <div class="finalScore" id="finalScore">3 – 1</div>
    <div id="newBest">★ New best!</div>
    <div class="overlayBtns">
      <button id="playAgain">Play again</button>
      <button id="menuBtn">Main menu</button>
    </div>
  </div>

  <button id="muteBtn" aria-label="Toggle sound">🔊</button>
</div>

<script>
(() => {
  "use strict";

  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");

  // ---- Game modes ----
  const MODES = {
    classic: {
      label: "Classic", shots: 5,
      desc: "Best of five penalties. Beat the keeper and outscore the gloves to win the shootout."
    },
    competition: {
      label: "Competition", shots: 8,
      desc: "Eight shots, points for placement. Pick out the corners and top bins to rack up the highest total."
    },
    survival: {
      label: "Survival", shots: Infinity,
      desc: "Keep scoring to build your streak. One save or miss and the run is over — how long can you last?"
    },
  };

  // ---- Persistent high scores ----
  const HKEY = "pen_high_v1";
  let high = loadHigh();
  function loadHigh() {
    try { return JSON.parse(localStorage.getItem(HKEY)) || {}; } catch (e) { return {}; }
  }
  function saveHigh() {
    try { localStorage.setItem(HKEY, JSON.stringify(high)); } catch (e) {}
  }

  // ---- Sound (Web Audio API, no external files) ----
  const Sound = (() => {
    let actx = null;
    let muted = localStorage.getItem("pen_muted") === "1";
    function ensure() {
      if (!actx) {
        try { actx = new (window.AudioContext || window.webkitAudioContext)(); }
        catch (e) { actx = null; }
      }
      if (actx && actx.state === "suspended") actx.resume();
    }
    function env(g, t, a, d, peak) {
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(peak, t + a);
      g.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
    }
    function note(freq, start, dur, type = "sine", peak = 0.25, slideTo = null) {
      if (!actx) return;
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, start);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, start + dur);
      env(g, start, 0.006, dur, peak);
      o.connect(g).connect(actx.destination);
      o.start(start); o.stop(start + dur + 0.05);
    }
    function noise(start, dur, peak = 0.3, filterFreq = 1000, type = "lowpass") {
      if (!actx) return;
      const n = Math.floor(actx.sampleRate * dur);
      const buf = actx.createBuffer(1, n, actx.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < n; i++) data[i] = Math.random() * 2 - 1;
      const src = actx.createBufferSource(); src.buffer = buf;
      const f = actx.createBiquadFilter(); f.type = type; f.frequency.value = filterFreq;
      const g = actx.createGain(); env(g, start, 0.006, dur, peak);
      src.connect(f).connect(g).connect(actx.destination);
      src.start(start); src.stop(start + dur + 0.02);
    }
    function kick() {
      ensure(); if (muted || !actx) return;
      const t = actx.currentTime;
      note(170, t, 0.12, "sine", 0.45, 60);   // boot thump with pitch drop
      noise(t, 0.05, 0.28, 2200, "lowpass");   // contact snap
    }
    function goal() {
      ensure(); if (muted || !actx) return;
      const t = actx.currentTime;
      [523.25, 659.25, 783.99, 1046.5].forEach((f, i) =>
        note(f, t + i * 0.09, 0.26, "triangle", 0.3));
      noise(t, 0.55, 0.10, 2800, "highpass");  // crowd swell
    }
    function save() {
      ensure(); if (muted || !actx) return;
      const t = actx.currentTime;
      note(230, t, 0.18, "square", 0.3, 110);  // gloves thunk
      noise(t, 0.09, 0.3, 700, "lowpass");
    }
    function miss() {
      ensure(); if (muted || !actx) return;
      const t = actx.currentTime;
      note(440, t, 0.4, "sawtooth", 0.16, 120); // descending whoosh
      noise(t, 0.3, 0.07, 1400, "bandpass");
    }
    return {
      ensure, kick, goal, save, miss,
      toggleMute() { muted = !muted; localStorage.setItem("pen_muted", muted ? "1" : "0"); return muted; },
      isMuted() { return muted; },
    };
  })();

  // ---- Layout / sizing ----
  let W = 0, H = 0, DPR = 1;
  const field = {};

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2.5);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    computeField();
  }

  function computeField() {
    const goalW = Math.min(W * 0.62, 560);
    const goalH = goalW * 0.42;
    const goalX = (W - goalW) / 2;
    field.horizonY = H * 0.30;
    field.goalX = goalX;
    field.goalY = field.horizonY + H * 0.04;
    field.goalW = goalW;
    field.goalH = goalH;
    field.postT = Math.max(6, goalW * 0.016);
    field.ballStartX = W / 2;
    field.ballStartY = H * 0.86;
    field.ballR = Math.max(16, Math.min(W, H) * 0.032);
    field.mouthX = goalX + field.postT;
    field.mouthW = goalW - field.postT * 2;
    field.mouthY = field.goalY + field.postT;
    field.mouthH = goalH - field.postT;
  }

  // ---- Game state ----
  let mode = "classic";       // active play mode
  let selectedMode = "classic"; // chosen on start screen
  let state = "menu";         // menu | aiming | shooting | resolving | over
  let shotIndex = 0;
  let youScore = 0, keeperScore = 0;   // classic
  let goals = 0, savedOrMissed = 0;
  let totalPoints = 0;                  // competition / survival
  let streak = 0;                       // survival
  const results = [];                   // 'goal' | 'miss' (classic pips)

  const ball = { x: 0, y: 0, r: 0, scale: 1, spin: 0, flying: false };
  const keeper = { dive: 0, targetDive: 0, jump: 0, targetJump: 0, chosen: false, guess: 0, decisionTime: 0 };

  let aiming = false, aimStart = null, aimCur = null;
  let netWobble = 0, netWobbleT = 0;
  let shot = null;

  function resetBall() {
    ball.x = field.ballStartX;
    ball.y = field.ballStartY;
    ball.r = field.ballR;
    ball.scale = 1;
    ball.spin = 0;
    ball.flying = false;
  }

  function resetKeeper() {
    keeper.dive = keeper.targetDive = 0;
    keeper.jump = keeper.targetJump = 0;
    keeper.chosen = false;
    keeper.guess = 0;
  }

  // ---- Element refs ----
  const hudEl = document.getElementById("hud");
  const leftLabel = document.getElementById("leftLabel");
  const leftVal = document.getElementById("leftVal");
  const centerLabel = document.getElementById("centerLabel");
  const centerVal = document.getElementById("centerVal");
  const rightLabel = document.getElementById("rightLabel");
  const rightVal = document.getElementById("rightVal");
  const rightSub = document.getElementById("rightSub");
  const trackEl = document.getElementById("shotTrack");
  const messageEl = document.getElementById("message");
  const pointsPopupEl = document.getElementById("pointsPopup");
  const overlay = document.getElementById("overlay");
  const hintEl = document.getElementById("hint");
  const startScreen = document.getElementById("startScreen");
  const startHighEl = document.getElementById("startHigh");
  const modeDescEl = document.getElementById("modeDesc");
  const newBestEl = document.getElementById("newBest");
  const muteBtn = document.getElementById("muteBtn");

  // ---- Menu / flow ----
  function highText(m) {
    const v = high[m] || 0;
    if (m === "classic") return v + " / 5 goals";
    if (m === "competition") return v + " pts";
    return v + " in a row";
  }

  function refreshStartScreen() {
    modeDescEl.textContent = MODES[selectedMode].desc;
    startHighEl.textContent = highText(selectedMode);
  }

  function showMenu() {
    state = "menu";
    overlay.classList.remove("show");
    newBestEl.classList.remove("show");
    hudEl.classList.remove("show");
    startScreen.classList.add("show");
    showHint(false);
    resetKeeper();
    resetBall();
    shot = null;
    refreshStartScreen();
  }

  function startGame(m) {
    mode = m;
    Sound.ensure();
    startScreen.classList.remove("show");
    newGame();
  }

  function newGame() {
    shotIndex = 0;
    youScore = keeperScore = 0;
    goals = savedOrMissed = 0;
    totalPoints = 0; streak = 0;
    results.length = 0;
    state = "aiming";
    resetKeeper();
    resetBall();
    shot = null;
    overlay.classList.remove("show");
    newBestEl.classList.remove("show");
    hudEl.classList.add("show");
    updateHUD();
    showHint(true);
    setTimeout(() => { if (state === "aiming" && shotIndex === 0) showHint(false); }, 3200);
  }

  // ---- HUD ----
  function renderPips() {
    trackEl.innerHTML = "";
    for (let i = 0; i < MODES.classic.shots; i++) {
      const p = document.createElement("div");
      p.className = "pip";
      if (results[i] === "goal") p.classList.add("goal");
      else if (results[i] === "miss") p.classList.add("miss");
      trackEl.appendChild(p);
    }
  }

  function updateHUD() {
    const shots = MODES[mode].shots;
    if (mode === "classic") {
      leftLabel.textContent = "You"; leftVal.textContent = youScore;
      trackEl.style.display = "flex"; renderPips();
      centerLabel.textContent = "Penalty";
      centerVal.textContent = Math.min(shotIndex + 1, shots) + " / " + shots;
      rightLabel.textContent = "Keeper"; rightVal.textContent = keeperScore;
      rightSub.textContent = "Best " + (high.classic || 0) + "/5";
    } else if (mode === "competition") {
      leftLabel.textContent = "Points"; leftVal.textContent = totalPoints;
      trackEl.style.display = "none";
      centerLabel.textContent = "Shot";
      centerVal.textContent = Math.min(shotIndex + 1, shots) + " / " + shots;
      rightLabel.textContent = "Best"; rightVal.textContent = (high.competition || 0);
      rightSub.textContent = goals + " scored";
    } else { // survival
      leftLabel.textContent = "Points"; leftVal.textContent = totalPoints;
      trackEl.style.display = "none";
      centerLabel.textContent = "Streak"; centerVal.textContent = streak;
      rightLabel.textContent = "Best"; rightVal.textContent = (high.survival || 0);
      rightSub.textContent = "in a row";
    }
  }

  function showHint(show) { hintEl.style.opacity = show ? "1" : "0"; }

  function flashMessage(text, type) {
    messageEl.textContent = text;
    messageEl.className = "";
    messageEl.classList.add(type, "show");
    setTimeout(() => messageEl.classList.remove("show"), 1100);
  }

  function showPoints(text, color) {
    pointsPopupEl.textContent = text;
    pointsPopupEl.style.color = color || "var(--accent)";
    pointsPopupEl.classList.remove("show");
    void pointsPopupEl.offsetWidth; // restart animation
    pointsPopupEl.classList.add("show");
  }

  // ---- Input ----
  function pointFromEvent(e) {
    const t = e.touches ? e.touches[0] : e;
    return { x: t.clientX, y: t.clientY };
  }

  function onDown(e) {
    if (state !== "aiming") return;
    const p = pointFromEvent(e);
    const d = Math.hypot(p.x - ball.x, p.y - ball.y);
    if (d > ball.r * 3.2) return;
    e.preventDefault();
    Sound.ensure();
    aiming = true;
    aimStart = { x: ball.x, y: ball.y };
    aimCur = p;
    showHint(false);
  }

  function onMove(e) {
    if (!aiming) return;
    e.preventDefault();
    aimCur = pointFromEvent(e);
  }

  function onUp(e) {
    if (!aiming) return;
    e.preventDefault();
    aiming = false;
    const dx = aimCur.x - aimStart.x;
    const dy = aimCur.y - aimStart.y;
    const dragLen = Math.hypot(dx, dy);
    if (dragLen < ball.r * 0.6 || dy > -8) {
      aimStart = aimCur = null;
      return;
    }
    launchShot(dx, dy, dragLen);
  }

  canvas.addEventListener("touchstart", onDown, { passive: false });
  canvas.addEventListener("touchmove", onMove, { passive: false });
  canvas.addEventListener("touchend", onUp, { passive: false });
  canvas.addEventListener("mousedown", onDown);
  window.addEventListener("mousemove", onMove);
  window.addEventListener("mouseup", onUp);

  // ---- Shooting ----
  function launchShot(dx, dy, dragLen) {
    state = "shooting";
    const maxDrag = Math.min(W, H) * 0.42;
    const power = Math.min(dragLen / maxDrag, 1);
    const targetXFactor = (dx / (maxDrag * 0.7));
    const targetYFactor = Math.min(Math.abs(dy) / (maxDrag * 0.85), 1.15);

    const mouthCx = field.mouthX + field.mouthW / 2;
    const landX = mouthCx + targetXFactor * (field.mouthW * 0.62);
    const goalLineY = field.mouthY + field.mouthH;
    const landY = goalLineY - targetYFactor * (field.mouthH * 1.02);

    const duration = 720 - power * 300;

    shot = {
      t0: performance.now(), duration,
      fromX: ball.x, fromY: ball.y, landX, landY, power, targetXFactor,
      arc: Math.min(0.5 + targetYFactor * 0.5, 1) * (H * 0.10) * (0.6 + power * 0.7),
      spinDir: Math.sign(dx) || 1,
      resolved: false, saved: false, scored: false, onTarget: false,
    };

    ball.flying = true;
    Sound.kick();
    decideKeeper(targetXFactor);
  }

  function decideKeeper(playerTargetXFactor) {
    const r = Math.random();
    let guess;
    if (r < 0.38) guess = -1;
    else if (r < 0.76) guess = 1;
    else guess = 0;
    if (Math.random() < 0.22) {
      guess = playerTargetXFactor < -0.18 ? -1 : playerTargetXFactor > 0.18 ? 1 : 0;
    }
    keeper.guess = guess;
    keeper.targetDive = guess * 0.92;
    keeper.targetJump = guess === 0 ? 0.12 : 0.85;
    keeper.chosen = true;
    keeper.decisionTime = performance.now() + 60;
  }

  // Points for a scored shot, based on placement.
  function shotPoints(landX, landY) {
    const relX = Math.max(0, Math.min(1, (landX - field.mouthX) / field.mouthW));
    const goalLineY = field.mouthY + field.mouthH;
    const h = (goalLineY - landY) / field.mouthH; // 0 low .. 1 top
    const sideDist = Math.min(relX, 1 - relX);    // 0 at posts .. .5 center
    const isSide = sideDist < 0.22;
    const isTop = h > 0.62;
    const isLow = h < 0.18;
    if (isSide && isTop) return { pts: 100, label: "Top corner!" };
    if (isSide && isLow) return { pts: 80, label: "Bottom corner!" };
    if (isSide)          return { pts: 60, label: "Side netting!" };
    if (isTop)           return { pts: 50, label: "Roof of the net!" };
    if (h > 0.35)        return { pts: 30, label: "Tidy finish" };
    return { pts: 15, label: "Down the middle" };
  }

  function resolveShot() {
    if (shot.resolved) return;
    shot.resolved = true;

    const insideX = shot.landX > field.mouthX + ball.r * 0.3 && shot.landX < field.mouthX + field.mouthW - ball.r * 0.3;
    const insideY = shot.landY > field.mouthY - ball.r * 0.2 && shot.landY < field.mouthY + field.mouthH + ball.r * 0.2;
    const onTarget = insideX && insideY;
    shot.onTarget = onTarget;

    let saved = false;
    if (onTarget) {
      const mouthCx = field.mouthX + field.mouthW / 2;
      const keeperX = mouthCx + keeper.dive * (field.mouthW * 0.42);
      const goalLineY = field.mouthY + field.mouthH;
      const shotHeight = (goalLineY - shot.landY) / field.mouthH;
      let reachX = field.mouthW * 0.20;
      if (keeper.guess === 0) reachX = field.mouthW * 0.16;
      const dxToKeeper = Math.abs(shot.landX - keeperX);
      let vertCover = 1;
      if (shotHeight > 0.72) vertCover = 0.45;
      else if (shotHeight < 0.12) vertCover = 0.7;
      if (keeper.guess === 0 && shotHeight > 0.5) vertCover *= 0.6;
      if (dxToKeeper < reachX && Math.random() < vertCover) saved = true;
    }

    let outcome;
    if (onTarget && !saved) outcome = "goal";
    else if (onTarget && saved) outcome = "save";
    else outcome = "miss";

    if (outcome === "goal") {
      const p = shotPoints(shot.landX, shot.landY);
      let pts = p.pts, label = p.label;
      // Bonus for beating a keeper who guessed your side.
      if (keeper.guess !== 0 && Math.sign(keeper.guess) === Math.sign(shot.targetXFactor) && Math.abs(shot.targetXFactor) > 0.2) {
        pts += 20; label = "Beat the keeper!";
      }
      shot.scored = true;
      goals++; totalPoints += pts;
      if (mode === "survival") streak++;
      if (mode === "classic") { youScore++; results[shotIndex] = "goal"; }
      triggerNetWobble();
      flashMessage("GOAL!", "goal");
      Sound.goal();
      showPoints("+" + pts + " — " + label, "var(--accent)");
    } else if (outcome === "save") {
      shot.saved = true;
      savedOrMissed++;
      if (mode === "classic") { keeperScore++; results[shotIndex] = "miss"; }
      flashMessage("SAVED!", "save");
      Sound.save();
      showPoints("No points", "#fbbf24");
    } else {
      savedOrMissed++;
      if (mode === "classic") { keeperScore++; results[shotIndex] = "miss"; }
      flashMessage("MISS!", "miss");
      Sound.miss();
      showPoints("Off target", "#f87171");
    }
    updateHUD();

    state = "resolving";
    const survivalFail = (mode === "survival" && outcome !== "goal");
    setTimeout(() => { if (survivalFail) endGame(); else nextShot(); }, 1300);
  }

  function nextShot() {
    shotIndex++;
    if (shotIndex >= MODES[mode].shots) { endGame(); return; }
    resetKeeper();
    shot = null;
    resetBall();
    state = "aiming";
    updateHUD();
  }

  function endGame() {
    state = "over";
    let scoreVal;
    if (mode === "classic") scoreVal = youScore;
    else if (mode === "competition") scoreVal = totalPoints;
    else scoreVal = streak;

    const prev = high[mode] || 0;
    let isBest = false;
    if (scoreVal > prev) { high[mode] = scoreVal; saveHigh(); isBest = true; }

    const title = document.getElementById("winTitle");
    const sub = document.getElementById("winSub");
    const fs = document.getElementById("finalScore");

    if (mode === "classic") {
      const win = youScore > keeperScore, draw = youScore === keeperScore;
      fs.textContent = youScore + " – " + keeperScore;
      if (win) { title.textContent = "You Win! 🏆"; sub.textContent = "Clinical from the spot."; }
      else if (draw) { title.textContent = "It's a Draw"; sub.textContent = "Honours even."; }
      else { title.textContent = "Keeper Wins"; sub.textContent = "Beaten by the gloves."; }
    } else if (mode === "competition") {
      title.textContent = "Full Time";
      sub.textContent = goals + " of " + MODES.competition.shots + " scored";
      fs.textContent = totalPoints + " pts";
    } else {
      title.textContent = streak > 0 ? "Run Over" : "No Luck";
      sub.textContent = streak === 1 ? "1 goal before the slip" : streak + " in a row · " + totalPoints + " pts";
      fs.textContent = streak + " streak";
    }

    newBestEl.classList.toggle("show", isBest);
    hudEl.classList.remove("show");
    overlay.classList.add("show");
  }

  function triggerNetWobble() { netWobble = 1; netWobbleT = performance.now(); }

  // ---- Buttons ----
  document.getElementById("startBtn").addEventListener("click", () => startGame(selectedMode));
  document.getElementById("playAgain").addEventListener("click", () => startGame(mode));
  document.getElementById("menuBtn").addEventListener("click", showMenu);

  document.querySelectorAll(".modeBtn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".modeBtn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      selectedMode = btn.dataset.mode;
      refreshStartScreen();
    });
  });

  function renderMute() { muteBtn.textContent = Sound.isMuted() ? "🔇" : "🔊"; }
  muteBtn.addEventListener("click", () => { Sound.ensure(); Sound.toggleMute(); renderMute(); });
  renderMute();

  // ---- Rendering ----
  function draw(now) {
    ctx.clearRect(0, 0, W, H);
    drawBackground();
    drawGoalBack();
    drawNet(now);
    drawKeeper(now);
    drawGoalPosts();
    updateBall(now);
    drawAim();
    drawBall(now);
    requestAnimationFrame(draw);
  }

  function drawBackground() {
    const sky = ctx.createLinearGradient(0, 0, 0, field.horizonY);
    sky.addColorStop(0, "#1a2a44");
    sky.addColorStop(1, "#2e4a6b");
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, field.horizonY);

    ctx.fillStyle = "#22324a";
    ctx.fillRect(0, field.horizonY - H * 0.10, W, H * 0.10);
    ctx.save();
    ctx.globalAlpha = 0.5;
    for (let i = 0; i < 60; i++) {
      const cx = (i * 53.3 % W);
      const cy = field.horizonY - H * 0.10 + ((i * 31) % (H * 0.10));
      ctx.fillStyle = ["#e74c3c","#f1c40f","#3498db","#ecf0f1","#2ecc71"][i % 5];
      ctx.fillRect(cx, cy, 3, 3);
    }
    ctx.restore();

    const grad = ctx.createLinearGradient(0, field.horizonY, 0, H);
    grad.addColorStop(0, "#2f7d36");
    grad.addColorStop(1, "#3fa34a");
    ctx.fillStyle = grad;
    ctx.fillRect(0, field.horizonY, W, H - field.horizonY);

    for (let i = 0; i < 8; i++) {
      const a = i / 8, b = (i + 1) / 8;
      const yA = field.horizonY + (H - field.horizonY) * a * a;
      const yB = field.horizonY + (H - field.horizonY) * b * b;
      if (i % 2 === 0) {
        ctx.fillStyle = "rgba(255,255,255,0.045)";
        ctx.fillRect(0, yA, W, yB - yA);
      }
    }

    ctx.strokeStyle = "rgba(255,255,255,0.55)";
    ctx.lineWidth = Math.max(2, W * 0.004);
    ctx.beginPath();
    ctx.ellipse(W/2, field.ballStartY + ball.r*0.2, field.goalW*0.30, field.goalH*0.10, 0, Math.PI*1.15, Math.PI*1.85);
    ctx.stroke();
    ctx.fillStyle = "rgba(255,255,255,0.8)";
    ctx.beginPath();
    ctx.ellipse(W/2, field.ballStartY + ball.r*1.05, ball.r*0.28, ball.r*0.12, 0, 0, Math.PI*2);
    ctx.fill();
  }

  function drawGoalBack() {
    ctx.save();
    ctx.fillStyle = "rgba(0,0,0,0.18)";
    ctx.fillRect(field.mouthX, field.mouthY, field.mouthW, field.mouthH);
    ctx.restore();
  }

  function drawNet(now) {
    let wob = 0;
    if (netWobble > 0) {
      const dt = (now - netWobbleT) / 1000;
      wob = Math.exp(-dt * 4) * Math.sin(dt * 26) * (field.goalW * 0.018);
      if (dt > 1.4) netWobble = 0;
    }
    ctx.save();
    ctx.beginPath();
    ctx.rect(field.mouthX, field.mouthY, field.mouthW, field.mouthH);
    ctx.clip();

    ctx.strokeStyle = "rgba(255,255,255,0.28)";
    ctx.lineWidth = 1;
    const cell = Math.max(14, field.goalW * 0.035);
    const x0 = field.mouthX, y0 = field.mouthY;
    const x1 = field.mouthX + field.mouthW, y1 = field.mouthY + field.mouthH;

    for (let x = x0; x <= x1 + cell; x += cell) {
      const sway = wob * Math.sin((x - x0) / field.mouthW * Math.PI);
      ctx.beginPath();
      ctx.moveTo(x, y0);
      ctx.lineTo(x + sway, y1);
      ctx.stroke();
    }
    for (let y = y0; y <= y1 + cell; y += cell) {
      const t = (y - y0) / field.mouthH;
      const sway = wob * Math.sin(t * Math.PI) * 0.6;
      ctx.beginPath();
      ctx.moveTo(x0, y);
      ctx.lineTo(x1, y + sway);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawGoalPosts() {
    ctx.save();
    ctx.fillStyle = "#f7f7f7";
    ctx.shadowColor = "rgba(0,0,0,0.35)";
    ctx.shadowBlur = 8;
    ctx.shadowOffsetY = 3;
    const t = field.postT;
    ctx.fillRect(field.goalX, field.goalY, t, field.goalH);
    ctx.fillRect(field.goalX + field.goalW - t, field.goalY, t, field.goalH);
    ctx.fillRect(field.goalX, field.goalY, field.goalW, t);
    ctx.restore();
  }

  function drawKeeper(now) {
    keeper.dive += (keeper.targetDive - keeper.dive) * 0.18;
    keeper.jump += (keeper.targetJump - keeper.jump) * 0.18;

    const mouthCx = field.mouthX + field.mouthW / 2;
    const kx = mouthCx + keeper.dive * (field.mouthW * 0.42);
    const baseY = field.mouthY + field.mouthH;
    const jumpPx = keeper.jump * field.mouthH * 0.55;
    const ky = baseY - jumpPx;

    const bodyH = field.mouthH * 0.62;
    const bodyW = bodyH * 0.34;

    ctx.save();
    ctx.translate(kx, ky);

    ctx.save();
    ctx.translate(0, baseY - ky);
    ctx.globalAlpha = 0.25 * (1 - keeper.jump * 0.6);
    ctx.fillStyle = "#000";
    ctx.beginPath();
    ctx.ellipse(0, 0, bodyW * 1.3, bodyW * 0.4, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    const lean = keeper.dive * 0.5;
    ctx.rotate(lean);

    const kit = "#ff5a3c";

    ctx.fillStyle = "#222";
    ctx.fillRect(-bodyW*0.36, 0, bodyW*0.3, bodyH*0.42);
    ctx.fillRect(bodyW*0.06, 0, bodyW*0.3, bodyH*0.42);

    ctx.fillStyle = kit;
    roundRect(ctx, -bodyW/2, -bodyH*0.55, bodyW, bodyH*0.62, bodyW*0.25);
    ctx.fill();

    ctx.strokeStyle = kit;
    ctx.lineWidth = bodyW * 0.32;
    ctx.lineCap = "round";
    const armSpread = 0.6 + keeper.jump * 0.7;
    const armY = -bodyH*0.42;
    const handLen = bodyH * 0.5 * (0.7 + keeper.jump*0.5);
    ctx.beginPath();
    ctx.moveTo(-bodyW*0.30, armY);
    ctx.lineTo(-bodyW*0.30 - handLen*armSpread, armY - handLen*0.7);
    ctx.moveTo(bodyW*0.30, armY);
    ctx.lineTo(bodyW*0.30 + handLen*armSpread, armY - handLen*0.7);
    ctx.stroke();
    ctx.fillStyle = "#fff";
    ctx.beginPath();
    ctx.arc(-bodyW*0.30 - handLen*armSpread, armY - handLen*0.7, bodyW*0.22, 0, Math.PI*2);
    ctx.arc(bodyW*0.30 + handLen*armSpread, armY - handLen*0.7, bodyW*0.22, 0, Math.PI*2);
    ctx.fill();

    ctx.fillStyle = "#f1c27d";
    ctx.beginPath();
    ctx.arc(0, -bodyH*0.66, bodyW*0.34, 0, Math.PI*2);
    ctx.fill();

    ctx.restore();
  }

  function roundRect(ctx, x, y, w, h, r) {
    r = Math.min(r, w/2, h/2);
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.arcTo(x+w, y, x+w, y+h, r);
    ctx.arcTo(x+w, y+h, x, y+h, r);
    ctx.arcTo(x, y+h, x, y, r);
    ctx.arcTo(x, y, x+w, y, r);
    ctx.closePath();
  }

  function updateBall(now) {
    if (state === "aiming" || state === "menu") {
      if (!aiming) { ball.x = field.ballStartX; ball.y = field.ballStartY; }
      ball.scale = 1;
      return;
    }
    if (!shot || !ball.flying) return;
    const tRaw = (now - shot.t0) / shot.duration;
    const t = Math.min(tRaw, 1);
    const et = t;
    ball.x = shot.fromX + (shot.landX - shot.fromX) * et;
    const baseY = shot.fromY + (shot.landY - shot.fromY) * et;
    const arc = Math.sin(t * Math.PI) * shot.arc;
    ball.y = baseY - arc;
    ball.scale = 1 - 0.55 * et;
    ball.spin += 0.4 * shot.spinDir;

    if (tRaw >= 1 && !shot.resolved) resolveShot();
  }

  function drawBall(now) {
    const r = ball.r * ball.scale;
    if (state !== "aiming" && state !== "menu") {
      ctx.save();
      ctx.globalAlpha = 0.22 * ball.scale;
      ctx.fillStyle = "#000";
      ctx.beginPath();
      ctx.ellipse(ball.x, Math.max(ball.y + r*1.4, ball.y + r), r*1.0, r*0.35, 0, 0, Math.PI*2);
      ctx.fill();
      ctx.restore();
    }

    ctx.save();
    ctx.translate(ball.x, ball.y);
    ctx.rotate(ball.spin);

    const g = ctx.createRadialGradient(-r*0.3, -r*0.3, r*0.2, 0, 0, r);
    g.addColorStop(0, "#ffffff");
    g.addColorStop(1, "#d8d8d8");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI*2);
    ctx.fill();

    ctx.fillStyle = "#1b1b1b";
    const spots = 5;
    ctx.beginPath();
    ctx.arc(0, 0, r*0.26, 0, Math.PI*2);
    ctx.fill();
    for (let i = 0; i < spots; i++) {
      const a = (i / spots) * Math.PI * 2;
      const px = Math.cos(a) * r * 0.62;
      const py = Math.sin(a) * r * 0.62;
      ctx.beginPath();
      ctx.arc(px, py, r*0.14, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.strokeStyle = "rgba(0,0,0,0.15)";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(0, 0, r*0.98, 0, Math.PI*2);
    ctx.stroke();

    ctx.restore();
  }

  function drawAim() {
    if (!aiming || !aimStart || !aimCur) return;
    const dx = aimCur.x - aimStart.x;
    const dy = aimCur.y - aimStart.y;
    const len = Math.hypot(dx, dy);
    const maxDrag = Math.min(W, H) * 0.42;
    const power = Math.min(len / maxDrag, 1);
    const ang = Math.atan2(dy, dx);

    ctx.save();
    ctx.strokeStyle = `rgba(255, ${Math.round(213 - power*120)}, 79, 0.9)`;
    ctx.lineWidth = Math.max(4, ball.r * 0.35);
    ctx.lineCap = "round";
    ctx.setLineDash([ball.r*0.5, ball.r*0.45]);
    ctx.beginPath();
    ctx.moveTo(ball.x, ball.y);
    ctx.lineTo(aimCur.x, aimCur.y);
    ctx.stroke();
    ctx.setLineDash([]);

    const ah = ball.r * 0.7;
    ctx.fillStyle = `rgba(255, ${Math.round(213 - power*120)}, 79, 0.95)`;
    ctx.translate(aimCur.x, aimCur.y);
    ctx.rotate(ang);
    ctx.beginPath();
    ctx.moveTo(ah, 0);
    ctx.lineTo(-ah*0.4, ah*0.55);
    ctx.lineTo(-ah*0.4, -ah*0.55);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.translate(ball.x, ball.y);
    ctx.strokeStyle = "rgba(255,255,255,0.25)";
    ctx.lineWidth = ball.r*0.28;
    ctx.beginPath();
    ctx.arc(0, 0, ball.r*1.5, 0, Math.PI*2);
    ctx.stroke();
    const hue = 120 - power*120;
    ctx.strokeStyle = `hsl(${hue}, 85%, 55%)`;
    ctx.lineWidth = ball.r*0.28;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.arc(0, 0, ball.r*1.5, -Math.PI/2, -Math.PI/2 + power*Math.PI*2);
    ctx.stroke();
    ctx.restore();
  }

  // ---- Boot ----
  window.addEventListener("resize", () => { resize(); if (state === "aiming" || state === "menu") resetBall(); });
  window.addEventListener("orientationchange", () => setTimeout(() => { resize(); if (state === "aiming" || state === "menu") resetBall(); }, 200));

  resize();
  showMenu();
  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
